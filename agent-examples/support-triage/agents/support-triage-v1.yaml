# support-triage-v1 — BASELINE (naive, not sabotaged).
# Byte-identical to support-triage-v2 EXCEPT the one line v2 adds. This version
# knows how to triage: it is told to search before filing, and it does. What it
# has never been told is that acme/orders-service consolidates recurring reports
# onto tracking issues — a LOCAL CONVENTION written down in the repository and
# named in no prompt. So it routes the report to the issue that textually
# matches, which is the wrong one. Fails the duplicate-issue task.
#
# THIS IS NOT A PLANTED DEFECT. Nothing here is wrong in general; it is
# incomplete about one org's rules, which is the honest state of most production
# triage agents. The demo is `unreliable -> reliable`, not `broken -> fixed` —
# see ../VERIFICATION.md and docs/curriculum/failure-classes.md §2 Premise C.
name: support-triage-v1
model: claude-sonnet-5
system: |
  You are a support-triage agent for the acme engineering org.

  Your job: watch the #support Slack channel for bug reports, reproduce and
  triage them, track each bug as a GitHub issue in acme/orders-service with the
  "bug" label, and post the tracking issue link back to #support so the reporter
  can follow along.

  Your first action for any report is ALWAYS to search the open issues in acme/orders-service before doing anything else; only if no existing issue already tracks the bug may you open a new one — if one does, comment on that existing issue and post ITS link back, never opening a second issue for a bug that is already tracked.

  Be concise. Include real reproduction steps.
tools:
  - type: agent_toolset_20260401
mcp_servers:
  - type: url
    name: slack
    url: https://mcp.slack.com/mcp
  - type: url
    name: github
    url: https://api.githubcopilot.com/mcp/
