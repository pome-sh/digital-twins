name: schedule alarm

# Reusable alarm every schedule-triggered workflow calls from a failure()-guarded
# job. One long-lived issue per title, closed on recovery. Deliberately no `if:` on
# the outcome value: validating it here would SKIP the job on a bad value and
# render a green check over a dead alarm.

on:
  workflow_call:
    inputs:
      title:
        description: Constant issue title for this alarm (one long-lived issue per title).
        required: true
        type: string
      label:
        description: One label per alarm, so unrelated alarms never share an issue.
        required: true
        type: string
      outcome:
        description: "'failure' files/updates the tracking issue; 'success' closes it. Any other value is a hard error, never a no-op."
        required: true
        type: string
      detail:
        description: What failed, in plain text. Only meaningful when outcome is 'failure'.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  alarm:
    name: file or close the tracking issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # actions/checkout
      issues: write # per-repo; the caller's job permissions must also grant this
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File, update, or close the tracking issue
        env:
          OUTCOME: ${{ inputs.outcome }}
          TITLE: ${{ inputs.title }}
          LABEL: ${{ inputs.label }}
          DETAIL: ${{ inputs.detail }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ci/file-schedule-alarm.sh
