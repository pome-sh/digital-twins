name: release
# The single release pipeline for the two published packages, replacing
# cli-release.yml (Changesets + a manual "publish the @pome-sh/* batch first"
# gate that produced 16 batch releases in 14 days, 4 of them consecutive
# failures) and sdk-publish.yml.
#
# Model: version-diff on push to main. Bump the version in the package's own
# package.json, merge, and this workflow publishes it. Nothing to remember, no
# version PR, no changeset files.
#
# @pome-sh/cli and @pome-sh/adapter-claude-sdk version INDEPENDENTLY (D11) and
# are diff-gated separately: the CLI bundles the internal packages, the adapter
# bundles the wire types, and neither depends on the other's version. There is
# no lockstep to enforce and therefore no sync-versions script.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: which packages need publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cli: ${{ steps.diff.outputs.cli }}
      adapter: ${{ steps.diff.outputs.adapter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Compare local versions against the registry
        id: diff
        run: |
          set -euo pipefail
          # Folded in from the deleted scripts/check-cli-version-floor.sh (F-724):
          # never publish from a version base BEHIND npm's published latest —
          # that retags `latest` backwards for every existing user. A version
          # that differs but does not sort above the registry's is a hard fail,
          # not a skip.
          decide() {
            local name="$1" manifest="$2" output="$3"
            local local_version registry_version npm_view_err
            local_version="$(node -p "require('./${manifest}').version")"
            npm_view_err="$(mktemp)"
            if registry_version="$(npm view "${name}" version 2>"${npm_view_err}")"; then
              :
            elif grep -q "E404" "${npm_view_err}"; then
              # Genuinely unpublished (brand-new package) — 0.0.0 is correct.
              registry_version="0.0.0"
            else
              # A registry/network/auth error is NOT "unpublished": treating it
              # as 0.0.0 would make any local version look publishable and
              # bypass the floor check below, which exists specifically to
              # stop retagging npm's latest backwards.
              echo "::error::npm view ${name} failed for a reason other than 'not found':"
              cat "${npm_view_err}" >&2
              rm -f "${npm_view_err}"
              exit 1
            fi
            rm -f "${npm_view_err}"
            echo "${name} — local: ${local_version}, registry: ${registry_version}"
            if [ "${local_version}" = "${registry_version}" ]; then
              echo "${output}=false" >> "$GITHUB_OUTPUT"
              echo "  ↳ unchanged; nothing to publish."
              return 0
            fi
            local highest
            highest="$(printf '%s\n%s\n' "${local_version}" "${registry_version}" | sort -V | tail -n1)"
            if [ "${highest}" != "${local_version}" ]; then
              echo "::error::${name} local version ${local_version} is BEHIND npm latest ${registry_version}. Publishing would retag latest backwards."
              exit 1
            fi
            echo "${output}=true" >> "$GITHUB_OUTPUT"
            echo "  ↳ will publish ${local_version}."
          }
          decide "@pome-sh/cli" "cli/package.json" "cli"
          decide "@pome-sh/adapter-claude-sdk" "packages/adapter-claude-sdk/package.json" "adapter"

  publish:
    name: publish ${{ matrix.package }}
    needs: plan
    if: needs.plan.outputs.cli == 'true' || needs.plan.outputs.adapter == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Never cancel a sibling mid-publish: a half-published pair is worse than
      # one failure to investigate.
      fail-fast: false
      matrix:
        include:
          - package: "@pome-sh/cli"
            enabled: ${{ needs.plan.outputs.cli }}
          - package: "@pome-sh/adapter-claude-sdk"
            enabled: ${{ needs.plan.outputs.adapter }}
    permissions:
      contents: read
      id-token: write # npm OIDC Trusted Publishing (provenance)
    steps:
      - if: matrix.enabled != 'true'
        run: echo "${{ matrix.package }} version unchanged — skipping."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.enabled == 'true'
      # Carried over from cli-release.yml. setup-node MUST stay off v7+ for the
      # OIDC path: v7 changed how `registry-url` writes .npmrc and breaks
      # Trusted Publishing with ENEEDAUTH (actions/setup-node#1551). renovate.json
      # disables major bumps for this action for the same reason.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.4.0
        if: matrix.enabled == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      # Pinned (not @latest): npm 11.18.0 crashes with "Exit handler never
      # called!" on the OIDC provenance publish path. 11.5.1 is the GA release
      # for trusted publishing and publishes cleanly.
      - name: Install npm with OIDC trusted publishing support
        if: matrix.enabled == 'true'
        run: npm install -g npm@11.5.1
      - if: matrix.enabled == 'true'
        run: npm ci
      - name: Build
        if: matrix.enabled == 'true'
        env:
          POME_GIT_SHA: ${{ github.sha }}
        run: npm run build
      # Every internal @pome-sh/* package is bundled into the two published
      # tarballs, so a third-party dep of an inlined package that is not
      # declared by the publisher becomes ERR_MODULE_NOT_FOUND for the user.
      - name: Bundled-runtime-dependency gate
        if: matrix.enabled == 'true'
        run: npm run gate:bundled-deps
      # The release gate: install both tarballs in a clean room, boot all five
      # twins from the CLI tarball, and typecheck a consumer against the
      # adapter's shipped declarations.
      - name: Clean-room pack test
        if: matrix.enabled == 'true'
        run: npm run test:pack
      - name: Guard against hard-link tarball (E415)
        if: matrix.enabled == 'true'
        run: |
          set -euo pipefail
          npm pack -w ${{ matrix.package }} --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tgz="$(ls "$RUNNER_TEMP"/*.tgz)"
          # The npm registry rejects tarballs with hard-link entries (E415).
          # Fail here rather than at publish time if any slip in.
          if tar -tvf "$tgz" | grep -qE '^h'; then
            echo "tarball contains hard links — npm registry would reject (E415):"
            tar -tvf "$tgz" | grep -E '^h'
            exit 1
          fi
          echo "E415 hard-link check OK: $tgz"
      - name: Publish
        if: matrix.enabled == 'true'
        run: npm publish -w ${{ matrix.package }} --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"
