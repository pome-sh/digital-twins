name: release

# Version-diff on push to main: bump a package's version, merge, this publishes it.
# The five published packages version independently.
#
# @pome-sh/wire goes to BOTH registries from one version line, on two lanes,
# because the auth mechanism differs per registry (npmjs OIDC vs a GITHUB_TOKEN
# .npmrc line) and because GitHub Packages needs auth even to READ — that read
# failing must not skip the npmjs publishes. wire's publishConfig targets GitHub
# Packages, so the npmjs lane passes an explicit --registry that outranks it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: which npm packages need publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cli: ${{ steps.diff.outputs.cli }}
      adapter: ${{ steps.diff.outputs.adapter }}
      checks: ${{ steps.diff.outputs.checks }}
      sandboxDomains: ${{ steps.diff.outputs.sandboxDomains }}
      wireNpm: ${{ steps.diff.outputs.wireNpm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Compare local versions against npm
        id: diff
        run: |
          set -euo pipefail
          scripts/ci/decide-publish.sh "@pome-sh/cli" "cli/package.json" "cli"
          scripts/ci/decide-publish.sh "@pome-sh/adapter-claude-sdk" "packages/adapter-claude-sdk/package.json" "adapter"
          scripts/ci/decide-publish.sh "@pome-sh/checks" "packages/checks/package.json" "checks"
          # Decided in the same step as @pome-sh/checks on purpose: the consumer
          # compares the two against each other, so releasing one without the other is
          # the failure this entry prevents.
          scripts/ci/decide-publish.sh "@pome-sh/sandbox-domains" "packages/sandbox-domains/package.json" "sandboxDomains"
          # wire's npmjs decision. Output-named `wireNpm`, distinct from plan-wire's
          # `wire` (GitHub Packages): one registry can be behind while the other is
          # current, so the two decisions cannot share a name.
          scripts/ci/decide-publish.sh "@pome-sh/wire" "packages/wire/package.json" "wireNpm"

  plan-wire:
    name: does @pome-sh/wire need publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GitHub Packages needs a token even to READ; without this the read 401s, and a
      # 401 is a hard failure by design, never "unpublished".
      packages: read
    outputs:
      wire: ${{ steps.diff.outputs.wire }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Authenticate reads against GitHub Packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '//npm.pkg.github.com/:_authToken=%s\n' "${GITHUB_PACKAGES_TOKEN}" >> "$HOME/.npmrc"
      - name: Compare the local version against GitHub Packages
        id: diff
        run: |
          set -euo pipefail
          scripts/ci/decide-publish.sh "@pome-sh/wire" "packages/wire/package.json" "wire" "https://npm.pkg.github.com"

  publish:
    name: publish ${{ matrix.package }}
    needs: plan
    if: needs.plan.outputs.cli == 'true' || needs.plan.outputs.adapter == 'true' || needs.plan.outputs.checks == 'true' || needs.plan.outputs.sandboxDomains == 'true' || needs.plan.outputs.wireNpm == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Never cancel a sibling mid-publish: a half-published set is worse than one
      # failure to investigate.
      fail-fast: false
      matrix:
        include:
          - package: "@pome-sh/cli"
            enabled: ${{ needs.plan.outputs.cli }}
          - package: "@pome-sh/adapter-claude-sdk"
            enabled: ${{ needs.plan.outputs.adapter }}
          - package: "@pome-sh/checks"
            enabled: ${{ needs.plan.outputs.checks }}
          - package: "@pome-sh/sandbox-domains"
            enabled: ${{ needs.plan.outputs.sandboxDomains }}
          - package: "@pome-sh/wire"
            enabled: ${{ needs.plan.outputs.wireNpm }}
    permissions:
      contents: read
      id-token: write # npm OIDC Trusted Publishing (provenance)
    steps:
      - if: matrix.enabled != 'true'
        run: echo "${{ matrix.package }} version unchanged — skipping."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.enabled == 'true'
      # MUST stay off setup-node v7+ on the OIDC path: v7 changed how registry-url
      # writes .npmrc and breaks Trusted Publishing with ENEEDAUTH.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.4.0
        if: matrix.enabled == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install npm with OIDC trusted publishing support
        if: matrix.enabled == 'true'
        # Pinned: npm 11.18 crashes with "Exit handler never called!" on the OIDC
        # provenance publish path.
        run: npm install -g npm@11.5.1
      - if: matrix.enabled == 'true'
        run: npm ci
      - name: Build
        if: matrix.enabled == 'true'
        env:
          POME_GIT_SHA: ${{ github.sha }}
        run: npm run build
      - name: Bundled-runtime-dependency lint rule
        if: matrix.enabled == 'true'
        run: npm run lint -- bundled-deps
      - name: Clean-room pack test
        if: matrix.enabled == 'true'
        run: npm run test:pack
      - name: Audit the @pome-sh/checks tarball
        if: matrix.enabled == 'true' && matrix.package == '@pome-sh/checks'
        run: npm run gate:checks-tarball
      - name: Audit the @pome-sh/sandbox-domains tarball
        if: matrix.enabled == 'true' && matrix.package == '@pome-sh/sandbox-domains'
        run: npm run gate:sandbox-domains-tarball
      - name: Guard against hard-link tarball (E415)
        if: matrix.enabled == 'true'
        run: |
          set -euo pipefail
          npm pack -w ${{ matrix.package }} --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tgz="$(ls "$RUNNER_TEMP"/*.tgz)"
          # The npm registry rejects tarballs with hard-link entries (E415).
          # Fail here rather than at publish time if any slip in.
          if tar -tvf "$tgz" | grep -qE '^h'; then
            echo "tarball contains hard links — npm registry would reject (E415):"
            tar -tvf "$tgz" | grep -E '^h'
            exit 1
          fi
          echo "E415 hard-link check OK: $tgz"
      - name: Publish
        if: matrix.enabled == 'true'
        run: |
          set -euo pipefail
          if [ "${{ matrix.package }}" = "@pome-sh/wire" ]; then
            npm publish -w "${{ matrix.package }}" --access public --registry https://registry.npmjs.org
          else
            npm publish -w "${{ matrix.package }}" --access public
          fi
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # dispatch-allocate-version fires seconds later and its re-pin only acts on a
      # version npm view already answers for, so wait here where the version is known.
      - name: The registry serves what we just published
        if: matrix.enabled == 'true'
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          # Asked by workspace NAME, which is all the matrix carries; decide-publish.sh
          # takes a manifest path, and duplicating that table here is a second place to
          # drift.
          #
          # Both JSON shapes are accepted because `npm pkg get version -w <name> --json`
          # answers {"<name>": "0.3.6"} on the npm@11.5.1 pinned two steps up and
          # {"<name>": {"version": "0.3.6"}} on npm 12. Reading only the nested shape
          # yields undefined, and `npm view <pkg>@undefined` then 404s for the full
          # budget and reds a publish that succeeded. The version is asserted to look
          # like one rather than interpolated blind, so a third shape fails HERE.
          version="$(npm pkg get version -w "${PKG}" --json | node -p 'const v=JSON.parse(require("node:fs").readFileSync(0,"utf8"))[process.env.PKG];const n=typeof v==="string"?v:v?.version;if(!/^\d+\.\d+\.\d+/.test(n??""))throw new Error("npm pkg get returned no version for "+process.env.PKG+": "+JSON.stringify(v));n')"
          for attempt in $(seq 1 18); do
            if npm view "${PKG}@${version}" version --prefer-online --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "registry.npmjs.org serves ${PKG}@${version} (attempt ${attempt}/18)."
              exit 0
            fi
            echo "::notice::${PKG}@${version} is not visible on registry.npmjs.org yet (attempt ${attempt}/18)."
            sleep 10
          done
          echo "::error::${PKG}@${version} published, but registry.npmjs.org did not serve it within 18 attempts over ~3 minutes."
          echo "The publish itself succeeded — do not re-run it. What this costs is the re-pin:"
          echo "dispatch-allocate-version either does not run at all, or dispatches a run that"
          echo "cannot see this version, so agent-examples/* keep the previous pin and"
          echo "check-example-pins-published.mjs reds on main. Once the version is visible, run"
          echo "  gh workflow run allocate-version.yml --ref main"
          echo "to land the re-pin by hand."
          exit 1

  publish-wire:
    name: publish @pome-sh/wire (GitHub Packages)
    needs: plan-wire
    if: needs.plan-wire.outputs.wire == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build @pome-sh/wire
        run: npm run build -w @pome-sh/wire
      - name: Typecheck and test @pome-sh/wire
        run: |
          set -euo pipefail
          npm run typecheck -w @pome-sh/wire
          npx vitest run --project wire
      - name: Trace-contract descriptor matches the shipped version
        run: npm run check:trace-contract -w @pome-sh/wire
      - name: Audit the wire tarball
        run: npm run gate:wire-tarball
      - name: Publish to GitHub Packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '//npm.pkg.github.com/:_authToken=%s\n' "${GITHUB_PACKAGES_TOKEN}" >> "$HOME/.npmrc"
          npm publish -w @pome-sh/wire --registry https://npm.pkg.github.com

  dispatch-allocate-version:
    name: dispatch allocate-version.yml after a publish
    needs: [publish, publish-wire]
    # !cancelled() is load-bearing: without a status-check function GitHub requires
    # every needs: job to have SUCCEEDED, and one of these two lanes is skipped on
    # almost every release — the job would be dropped and read as a clean skip while
    # the re-pin silently never happened.
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs.publish-wire.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint a pome-ops-push installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPS_APP_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
      - name: Dispatch allocate-version.yml
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api --method POST "repos/${{ github.repository }}/dispatches" -f event_type=repin-examples
