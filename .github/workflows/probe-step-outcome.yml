name: probe-step-outcome

# TEMPORARY — F-1230 review probe. Delete before merge.
#
# Settles, on real GitHub infrastructure rather than by reading docs, the two
# facts release-alarm.yml's `meta-alarm` job stakes everything on:
#   1. Does a FAILED job still propagate `needs.<job>.outputs`?
#   2. What is `steps.<id>.outcome` for a step that an earlier step's failure
#      prevented from running — '' (absent from the context) or 'skipped'?
# If (2) is 'skipped', a `checked == ''` gate makes the meta-alarm unfireable in
# exactly the case it exists for.
on:
  pull_request:
    paths:
      - ".github/workflows/probe-step-outcome.yml"

permissions:
  contents: read

jobs:
  # The mechanism-broke shape: a step fails BEFORE the `check` step.
  producer-broken:
    runs-on: ubuntu-latest
    outputs:
      checked: ${{ steps.check.outcome }}
    steps:
      - name: Break before check, as a failed checkout would
        run: exit 1
      - name: check
        id: check
        # An explicit `if:` that is true, matching release-alarm.yml's shape.
        if: github.repository != ''
        continue-on-error: true
        run: echo "check ran"

  # The mechanism-worked-and-found-a-problem shape: `check` runs and fails.
  producer-verdict:
    runs-on: ubuntu-latest
    outputs:
      checked: ${{ steps.check.outcome }}
    steps:
      - name: A step that succeeds
        run: echo ok
      - name: check
        id: check
        if: github.repository != ''
        continue-on-error: true
        run: exit 1
      - name: Fail the run the way release-alarm.yml deliberately does
        if: steps.check.outcome == 'failure'
        run: exit 1

  reader:
    needs: [producer-broken, producer-verdict]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Both directions
        run: |
          echo "broken.result=[${{ needs.producer-broken.result }}]"
          echo "broken.outputs.checked=[${{ needs.producer-broken.outputs.checked }}]"
          echo "verdict.result=[${{ needs.producer-verdict.result }}]"
          echo "verdict.outputs.checked=[${{ needs.producer-verdict.outputs.checked }}]"
          echo "--- what the SHIPPED gate would decide ---"
          echo "meta-alarm fires on broken?  ${{ needs.producer-broken.result == 'failure' && needs.producer-broken.outputs.checked != 'success' && needs.producer-broken.outputs.checked != 'failure' }}"
          echo "meta-alarm fires on verdict? ${{ needs.producer-verdict.result == 'failure' && needs.producer-verdict.outputs.checked != 'success' && needs.producer-verdict.outputs.checked != 'failure' }}"
          echo "--- what the ORIGINAL '== empty' gate would decide ---"
          echo "orig fires on broken?  ${{ needs.producer-broken.result == 'failure' && needs.producer-broken.outputs.checked == '' }}"
          echo "orig fires on verdict? ${{ needs.producer-verdict.result == 'failure' && needs.producer-verdict.outputs.checked == '' }}"
