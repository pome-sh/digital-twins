name: cli-release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/cli-release.yml'

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: version PR or publish (@pome-sh/cli)
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the version branch / tags
      pull-requests: write    # open the "Version Packages" PR
      id-token: write         # npm OIDC Trusted Publishing (provenance)
      actions: write          # F-1180 — approve workflow runs parked at action_required
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Keep npm pinned to the GA Trusted Publishing release used by this path.
      # Pinned (not @latest): npm 11.18.0 crashes with "Exit handler never
      # called!" on the OIDC provenance publish path. 11.5.1 is the GA release
      # for trusted publishing and publishes cleanly.
      - name: Install npm with OIDC trusted publishing support
        run: npm install -g npm@11.5.1
      # F-1135 — read the versions to probe FROM cli/package.json. This step
      # used to `npm view` seven hard-coded literals; they were the true pin set
      # for exactly one day (2026-07-20), the pins moved six times after, and
      # all seven kept resolving — so the step could not fail while looking like
      # something was watching. Sets ready=false (skip) when a pin matches
      # packages/ but its batch has not published; exits 1 when a pin is missing
      # AND disagrees with packages/, because no batch will ever publish that.
      - name: Check package dependencies are published
        id: package-deps
        working-directory: ${{ github.workspace }}
        run: node scripts/check-cli-pins-published.mjs
      - name: Skip until package batch is published
        if: steps.package-deps.outputs.ready != 'true'
        run: |
          echo "Skipping CLI release. Publish the packages-v* batch first, then rerun this workflow."
      # The new exact @pome-sh/* versions are published by the package batch
      # first. Regenerate the registry lock from the resolved manifest here,
      # then freeze install so the CLI tarball matches what this job resolved.
      - if: steps.package-deps.outputs.ready == 'true'
        run: |
          # --ignore-scripts on lock-only: prepare/tsc runs before deps exist.
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Guard against hard-link tarball (E415)
        if: steps.package-deps.outputs.ready == 'true'
        run: |
          set -euo pipefail
          npm run build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tgz="$(ls "$RUNNER_TEMP"/pome-sh-cli-*.tgz)"
          # The npm registry rejects tarballs with hard-link entries (E415).
          # Fail here rather than at publish time if any slip in.
          if tar -tvf "$tgz" | grep -qE '^h'; then
            echo "tarball contains hard links — npm registry would reject (E415):"
            tar -tvf "$tgz" | grep -E '^h'
            exit 1
          fi
          echo "E415 hard-link check OK: $tgz"
      # F-724 — last line of defense: never publish (or open a Version PR)
      # from a version base behind npm's published latest.
      - name: CLI version not behind npm latest
        if: steps.package-deps.outputs.ready == 'true'
        working-directory: ${{ github.workspace }}
        run: scripts/check-cli-version-floor.sh
      # F-1180 — the token here decides whether the release PR can ever merge.
      # GitHub parks every workflow run whose `triggering_actor` is
      # `github-actions[bot]` at `action_required` (0s, no status reported), so a
      # version PR pushed with the ambient GITHUB_TOKEN leaves main's three
      # required contexts sitting in `expected` forever — and `--admin` cannot
      # override an *absent* check, only a failed one. That is GitHub's
      # anti-recursion guard, deliberate design, not a bug.
      #
      # It is NOT the repo's fork-PR contributor-approval setting: Renovate
      # opens same-repo PRs here under that same setting and its runs go green.
      # Only `github-actions[bot]` parks. So the fix is a
      # real actor — RELEASE_BOT_TOKEN, a PAT (contents + pull-requests write),
      # the SPECS_BOT_TOKEN equivalent from F-1115 in pome-sh/openapi-spec-mcp.
      #
      # Falls back to GITHUB_TOKEN so releasing keeps working before the secret
      # is minted; the verify step below is what refuses to call that silence a
      # success.
      - name: Changesets — version PR or publish
        id: changesets
        if: steps.package-deps.outputs.ready == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          cwd: cli
          version: npm run changeset:version
          publish: npm run changeset:publish
          title: "chore(cli): version packages"
          commit: "chore(cli): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      # F-1180 — a release PR that opened fine and collects no checks looks
      # exactly like one nobody has got round to merging. This step polls the
      # head commit's check runs, approves anything parked, retriggers via
      # close/reopen when a PAT is available, and fails the run loudly if the
      # required contexts still will not report. Never exits 0 on silence.
      - name: Release PR will actually get its required checks
        if: steps.package-deps.outputs.ready == 'true' && steps.changesets.outputs.pullRequestNumber
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/verify-release-pr-checks.mjs
