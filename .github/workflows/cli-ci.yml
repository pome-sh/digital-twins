name: cli-ci
on:
  pull_request:
    paths:
      - 'cli/**'
      - 'packages/shared-types/**'
      - 'packages/sdk/**'
      - 'packages/twin-github/**'
      - 'packages/twin-gmail/**'
      - 'packages/twin-linear/**'
      - 'packages/twin-slack/**'
      - 'packages/twin-stripe/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-cli-version-bump.sh'
      - 'scripts/check-cli-version-floor.sh'
      - '.github/workflows/cli-ci.yml'
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'packages/shared-types/**'
      - 'packages/sdk/**'
      - 'packages/twin-github/**'
      - 'packages/twin-gmail/**'
      - 'packages/twin-linear/**'
      - 'packages/twin-slack/**'
      - 'packages/twin-stripe/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-cli-version-bump.sh'
      - 'scripts/check-cli-version-floor.sh'
      - '.github/workflows/cli-ci.yml'
  workflow_dispatch:

concurrency:
  group: cli-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ubuntu-latest · Node 24
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the CLI version-bump gate can diff against the PR base.
          fetch-depth: 0
      # Former cli-version-gate.yml — keep the policy check, drop the separate
      # required status. Skips cleanly when cli/src/** and cli/vendor/** are
      # untouched (see scripts/check-cli-version-bump.sh).
      - name: CLI version bump or changeset required
        if: ${{ github.event_name == 'pull_request' }}
        run: BASE_REF="origin/${{ github.event.pull_request.base.ref }}" scripts/check-cli-version-bump.sh
      # F-724 — cli/package.json must never sit behind npm's published latest;
      # publishing from a regressed base retags `latest` backwards.
      - name: CLI version not behind npm latest
        run: scripts/check-cli-version-floor.sh
      # Node 24 — the repo's engines floor (node:sqlite twins, PR #85/F-719).
      # The old reason (better-sqlite3's node-gyp needing Node 24 APIs) died
      # with F-704; the floor itself stands.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # F-692 / D9 — the no-eval-in-oss gate now runs ONCE, repo-wide, in
      # ci.yml's typecheck-test job (npm run gate:no-eval); this duplicate
      # cli-scoped step was folded in there.
      #
      # `cli/` is a root workspace member now: one `npm ci` links the
      # @pome-sh/* twins straight out of packages/*. No tarball rewriting, no
      # second lockfile — the pack-publishable / use-local-pome-tarballs dance
      # and the "publish the package batch first" gate are gone.
      - run: npm ci
      # F-705 — the CLI's production closure must stay free of gyp-marked
      # packages (the published artifact bundles the twins).
      - run: npm run gate:no-native
      - run: npm run typecheck -w @pome-sh/cli
      # The CLI compiles against the sibling packages' built dists
      # (`@pome-sh/sdk/server` → dist/server.d.ts), so build the workspace in
      # dependency order — the root build chain ends with the CLI.
      - run: npm run build
      - run: npm test -w @pome-sh/cli
      # F-709 — the frozen M1 runtime-contract assertions, asserted against
      # twins started via the CLI front door (`pome twin start <twin>`).
      # Reuses the build above; the CLI resolves the twins from the workspace.
      - name: Contract suite vs pome twin start
        run: node --test contract/cli-start.test.mjs
      # Former cli-publish-smoke.yml. The clean-room BOOT check moves to the
      # tsup lane: `bundleDependencies` stops working the moment `cli/` joins
      # the root workspace (npm hoists the workspace links to the repo-root
      # node_modules, so `cli/node_modules/@pome-sh/` is empty and npm packs a
      # tarball that DECLARES bundled deps while shipping none — npm then
      # trusts the declaration and skips fetching them, so the tarball installs
      # "successfully" and dies with ERR_MODULE_NOT_FOUND on first command).
      #
      # What this job still gates: the tarball packs, carries no hard-link
      # entries (npm registry E415), ships the bin entry — and, critically,
      # that the publish guard REFUSES it, so the freeze cannot be bypassed by
      # an `npm publish` from a green build.
      - name: Pack and assert the publish freeze holds
        run: |
          set -euo pipefail
          npm pack -w @pome-sh/cli --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tgz="$(ls "$RUNNER_TEMP"/pome-sh-cli-*.tgz)"
          if tar -tvf "$tgz" | grep -qE '^h'; then
            echo "tarball contains hard links — npm registry would reject (E415):"
            tar -tvf "$tgz" | grep -E '^h'
            exit 1
          fi
          tar -tzf "$tgz" | grep -qx 'package/dist/src/cli/main.js'
          echo "pack OK (no hard links, bin entry present): $tgz"
          if node cli/scripts/assert-publishable.mjs --quiet; then
            echo "::error::cli/scripts/assert-publishable.mjs accepted a tarball with unbundled private deps"
            exit 1
          fi
          echo "publish freeze holds: the guard refuses this tarball."
