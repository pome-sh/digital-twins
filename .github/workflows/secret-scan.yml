name: secret scan

# One scanner, one trigger (F-1606). TruffleHog over the PR diff, verified
# findings only.
#
# `main` requires PRs with strict required status checks
# (scripts/ci/assert-repo-policy.sh), so every commit that reaches main is
# scanned here first. That is why there is no `push:` and no cron: a push-to-main
# run rescans content this job already passed, and a weekly full-history run
# re-asks a settled question, since history is append-only and a secret is found
# once — when it lands.
#
# What was deleted rather than kept: a gitleaks full-tree scan (it rescanned
# every already-merged file on every PR, so a hit was either pre-existing and
# reddened an unrelated PR, or in the diff and already caught here), the
# `.gitleaks.toml` allowlist that existed only to silence that scan's false
# positives on test fixtures, and the cron plus its schedule-alarm pair.
#
# The trade-off, stated once: `--only-verified` proves a credential is live by
# calling the provider, so it has no false positives to allowlist — and misses
# secrets for providers it has no verifier for, plus keys already rotated. That
# coverage gap is deliberate.

on: pull_request

permissions:
  contents: read

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history: TruffleHog resolves base..head itself, and a shallow
      # clone need not contain the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan verified secrets in the PR diff
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.sha }}
          extra_args: --only-verified
