name: secret scan

# TruffleHog over the diff, verified findings only. `--only-verified` calls the
# provider to confirm a credential is live, so a finding is real and there is no
# allowlist to maintain. It does not see providers TruffleHog has no verifier
# for, or keys already rotated.
#
# Two triggers. `pull_request` is the required context on `main`. `push` covers
# what lands on `main` without a PR: ruleset `main founder-bypass` has two
# `always` bypass actors, allocate-version.yml pushes there with the release
# App's token, and scripts/ci/assert-repo-policy.sh cannot check that bypass
# list (it needs Administration:read, which this repo deliberately does not
# hold). A required check is not the same thing as a check that ran.
#
# A push whose commit message carries a skip-CI marker never reaches this
# workflow: that suppresses the push event outright. Automation pushing to
# `main` has to leave the marker off for this trigger to mean anything.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      # TruffleHog resolves base..head itself and a shallow clone need not
      # contain the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan verified secrets in the diff
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          # Part of the pin, not a convenience. The `uses:` sha pins a composite
          # wrapper; the scanner is a `docker run "${IMAGE}:${VERSION}"` and this
          # input defaults to the mutable `latest`. Keep it in step with `uses:`.
          version: 3.95.9
          extra_args: --only-verified
