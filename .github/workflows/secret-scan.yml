name: secret scan
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.24.3
  GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c

jobs:
  scan:
    name: gitleaks + trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "$tmp/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$tmp/$archive" | sha256sum -c -
          tar -xzf "$tmp/$archive" -C "$tmp" gitleaks
          mkdir -p "$HOME/.local/bin"
          install "$tmp/gitleaks" "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan current tree with gitleaks
        run: gitleaks detect --source . --no-git --redact --verbose --config .gitleaks.toml
      - name: Scan verified secrets in changed history
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified
      - name: Scan verified secrets in full history
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          extra_args: --only-verified

  # F-1230 — secret-scan.yml's weekly cron had no failure alarm at all: a
  # verified secret found by the schedule run (or a broken scanner install)
  # read exactly like a green PR run to anyone not reading Actions history by
  # hand. Embedded here rather than a separate cron file for the same reason
  # as repo-policy.yml — see schedule-alarm.yml's header comment.
  # Gated on the two events that actually run the full-history scan, NOT on
  # `!= 'pull_request'`. This file also triggers on push to main, and a push
  # run scans only `before..sha` (the full-history TruffleHog step above is
  # itself gated on schedule/dispatch). So a push run neither reproduces nor
  # disproves what a cron run found: firing on push would file a leak
  # introduced by one commit under a title claiming the weekly cron is
  # failing, and — worse — RECOVERING on push would close a real
  # secret-in-history finding minutes later because that run never looked at
  # history. That flap is what teaches people to skim past the label.
  schedule-alarm:
    needs: scan
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/schedule-alarm.yml
    with:
      title: "the secret-scan weekly cron is failing"
      label: "schedule-alarm:secret-scan"
      outcome: failure
      detail: "secret-scan.yml's scheduled run failed. This can mean gitleaks/TruffleHog found a verified secret, or that the scanner install itself broke — check the run log to tell which."

  schedule-alarm-recovery:
    needs: scan
    if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/schedule-alarm.yml
    with:
      title: "the secret-scan weekly cron is failing"
      label: "schedule-alarm:secret-scan"
      outcome: success
