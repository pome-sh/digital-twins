name: secret scan

# One scanner, two triggers (F-1606). TruffleHog over the diff, verified
# findings only.
#
# `pull_request` is the gate — it is the required context on `main`, so a PR
# cannot merge past a verified secret.
#
# `push: branches: [main]` is NOT redundant with it, and the first draft of this
# file was wrong to delete it. `main` is reachable without a PR: ruleset
# `main founder-bypass` has two `always` bypass actors (the release App and the
# founder team), and allocate-version.yml pushes straight to main with that
# App's token on every release bump — four of the eight commits on main before
# this file was written had no PR attached. The push run is the only scan those
# commits get. scripts/ci/assert-repo-policy.sh does not and cannot verify the
# bypass list (it says so at its own tail: that needs Administration:read,
# deliberately not held), so "required check on main" is not the same claim as
# "everything on main was checked".
#
# Deleted and staying deleted: the weekly cron plus its schedule-alarm/recovery
# pair and the full-history scan behind them — history is append-only, so a
# secret is found once, when it lands, and re-walking all of it every Monday
# only re-answers that. Also gone: a second scanner (gitleaks, regex/entropy,
# whose false positives on test fixtures bought the `.gitleaks.toml` allowlist)
# and its full-tree scan, which rescanned every already-merged file on every PR,
# so a hit was either pre-existing and reddened an unrelated PR, or in the diff
# and already caught here.
#
# The trade-off, stated once: `--only-verified` proves a credential is live by
# calling the provider, so it has no false positives to allowlist — and misses
# secrets for providers it has no verifier for, plus keys already rotated. That
# coverage gap is deliberate.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history: TruffleHog resolves base..head itself, and a shallow
      # clone need not contain the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan verified secrets in the diff
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          # `version:` is load-bearing, not decoration. The pinned `uses:` sha
          # pins a ~40-line composite wrapper; the scanner itself is a
          # `docker run "${IMAGE}:${VERSION}"`, and that input DEFAULTS TO
          # `latest`. Left unset, the only remaining secret gate in this repo
          # would ride a mutable tag — coverage could change with no diff
          # anywhere. Keep this in step with the `uses:` ref above.
          version: 3.95.9
          extra_args: --only-verified
