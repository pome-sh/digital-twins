name: agent-trace-overhead-gate

# Runs the bundled triage scenario in capture-on/off A/B pairs,
# accumulates N per-call latency samples from each, and fails the build when
# p99(with − without) exceeds the 5ms budget. N=1000 buys p99 stability, and
# when the first pair lands over budget the gate escalates to 3 pairs —
# median delta judged against budget + an A/A noise allowance measured from
# the no-capture baselines — so shared-runner tail noise can't flip the
# verdict while a real capture-path regression still fails every path.
# Same run also asserts PR/FAQ acceptance #1:
# scenario 01 with a no-adapter agent emits ≥1 LlmCallEvent + ≥1
# TwinHttpEvent (tool_call_id: null) in events.jsonl, and `pome inspect`
# exits 0 with a "Trace health" section.
#
# A durable-recorder micro-benchmark (heap vs file-backed fsync) with an
# explicit per-event p99 budget runs alongside it; the path filters cover
# packages/sdk + twin-slack/stripe so recorder durability changes trip the gate.
#
# Not a PR required check: the p99 latency gate is expensive and sensitive to
# runner noise. Keep coverage on main + PRs that touch recorder/SDK/twin paths
# + manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'packages/sdk/**'
      - 'packages/twin-github/**'
      - 'packages/twin-gmail/**'
      - 'packages/twin-linear/**'
      - 'packages/twin-slack/**'
      - 'packages/twin-stripe/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agent-trace-overhead-gate.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'packages/sdk/**'
      - 'packages/twin-github/**'
      - 'packages/twin-gmail/**'
      - 'packages/twin-linear/**'
      - 'packages/twin-slack/**'
      - 'packages/twin-stripe/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agent-trace-overhead-gate.yml'
  workflow_dispatch:

concurrency:
  group: agent-trace-overhead-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: overhead gate (p99 < 5ms) + PR/FAQ #1
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json
      # Repo-root install populates every workspace package plus its devDeps so
      # the CLI build below can build all publishable packages in dependency
      # order.
      - run: npm ci
      # `cli/` is a root workspace member: the `npm ci` above already linked
      # the @pome-sh/* packages out of packages/*, so the CLI builds straight
      # from this checkout (no tarball pack + manifest rewrite, no second
      # lockfile). The root chain builds the packages in dependency order and
      # ends with the CLI.
      - name: Build CLI
        run: npm run build
      - name: Run agent-trace overhead gate (PR/FAQ #1)
        env:
          # Wired by `cli/scripts/overhead-gate.ts` (`gate:agent-trace-overhead`
          # in cli/package.json — a named script so check-packages-scripts-
          # wired.mjs's cli/ audit can see it wired, same `npm run <name> -w
          # <pkg>` shape as everywhere else in this file). The budget is 5ms; N
          # and the escalation pair count are calibrated for shared-runner noise.
          # Overrideable for local triage runs.
          OVERHEAD_BENCH_N: '1000'
          OVERHEAD_BENCH_PAIRS: '3'
          OVERHEAD_BENCH_BUDGET_MS: '5'
        run: npm run gate:agent-trace-overhead -w @pome-sh/cli
      - name: Run durable recorder overhead gate
        env:
          RECORDER_OVERHEAD_N: '200'
          RECORDER_OVERHEAD_BUDGET_MS: '1'
        run: npm run gate:recorder-overhead -w @pome-sh/cli
