name: agent-trace-overhead-gate

# p99 capture overhead against a 5ms budget, plus the recorder and CAS-adapter
# acceptance runs. Not a required check: the latency gate is sensitive to runner
# noise, so it covers main, path-matched PRs and manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'packages/sdk/**'
      - 'packages/twin-github/**'
      - 'packages/twin-gmail/**'
      - 'packages/twin-linear/**'
      - 'packages/twin-slack/**'
      - 'packages/twin-stripe/**'
      - 'packages/adapter-claude-sdk/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agent-trace-overhead-gate.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'packages/sdk/**'
      - 'packages/twin-github/**'
      - 'packages/twin-gmail/**'
      - 'packages/twin-linear/**'
      - 'packages/twin-slack/**'
      - 'packages/twin-stripe/**'
      - 'packages/adapter-claude-sdk/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agent-trace-overhead-gate.yml'
  workflow_dispatch:

concurrency:
  group: agent-trace-overhead-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: overhead gate (p99 < 5ms) + PR/FAQ #1 / #2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build CLI
        run: npm run build
      - name: Run agent-trace overhead gate (PR/FAQ #1)
        env:
          OVERHEAD_BENCH_N: '1000'
          OVERHEAD_BENCH_PAIRS: '3'
          OVERHEAD_BENCH_BUDGET_MS: '5'
        run: npm run gate:agent-trace-overhead -w @pome-sh/cli
      - name: Run durable recorder overhead gate
        env:
          RECORDER_OVERHEAD_N: '200'
          RECORDER_OVERHEAD_BUDGET_MS: '1'
        run: npm run gate:recorder-overhead -w @pome-sh/cli
      - name: Run CAS-adapter acceptance gate (PR/FAQ #2)
        env:
          CAS_ACCEPTANCE_ARTIFACT_OUT: ${{ github.workspace }}/cas-adapter-trace
        run: npm run gate:cas-adapter-acceptance -w @pome-sh/cli
      - name: Upload CAS-adapter trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cas-adapter-trace
          path: cas-adapter-trace
          if-no-files-found: warn
