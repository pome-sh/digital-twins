name: repo-policy

# F-696 — assert protected main policy (PR + review + required checks).
# F-1212 — the live check now reads GET .../rules/branches/{branch}, which an
# ordinary contents:read GITHUB_TOKEN can call. The legacy pair it replaces
# needed Administration:read, which GITHUB_TOKEN cannot hold: GET .../protection
# is auth-gated outright (401 unauthenticated), and while GET .../rulesets/{id}
# does answer 200 for any caller on a public repo, it ELIDES the bypass_actors
# field for callers without that scope — so the old check depended on a PAT
# (REPO_POLICY_TOKEN) that was never minted, and the weekly cron was red since
# it shipped. No PAT anywhere now, so the live check also runs on
# pull_request: drift is caught on every touching PR, not just weekly.
# repo-policy is not in config/required-checks.json's required set, so this
# cannot deadlock a merge.
#
# Ordering, when you change the required contexts: land the config/required-checks.json
# edit first and accept a red repo-policy on that PR and until the ruleset is
# updated by hand (including a failing Monday cron, which will file the
# schedule-alarm issue). Doing it the other way — requiring a context before the
# job that reports it exists — leaves every PR waiting forever on a check that
# never runs, and that is the actual deadlock. The red here is the check working.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/ci/assert-repo-policy.sh"
      - "scripts/ci/assert-repo-policy.test.mjs"
      # F-1180 — the required-context list moved here; this script now reads it.
      - "config/required-checks.json"
      - ".github/workflows/repo-policy.yml"
      - ".github/workflows/dependency-review.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  assert:
    name: assert main protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regression-test policy validator
        run: node scripts/ci/assert-repo-policy.test.mjs
      - name: Assert live branch protection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/ci/assert-repo-policy.sh

  # F-1230 — repo-policy.yml's weekly cron was firing and failing since it
  # shipped (REPO_POLICY_TOKEN never existed, F-1212) with nobody told. This
  # job sees that failure in the same run `assert` failed in — see
  # schedule-alarm.yml for why an embedded failure() job, not a second
  # separately-cron'd file, is the right shape here.
  # Gated on the events that actually run the live drift check, rather than on
  # `!= 'pull_request'`. F-1212 dropped the PAT and now runs the live check on
  # every event, but stating the positive set here still means a future event
  # (e.g. `push:`) cannot silently start filing (or, worse, CLOSING) this
  # alarm before someone decides it should.
  schedule-alarm:
    needs: assert
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/schedule-alarm.yml
    with:
      title: "the repo-policy weekly cron is failing"
      label: "schedule-alarm:repo-policy"
      outcome: failure
      detail: "repo-policy.yml's scheduled run failed. F-1212 removed the REPO_POLICY_TOKEN dependency, so check the run log for the actual assertion in scripts/ci/assert-repo-policy.sh that broke."

  # The other direction: a recovered run closes the tracking issue.
  schedule-alarm-recovery:
    needs: assert
    if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/schedule-alarm.yml
    with:
      title: "the repo-policy weekly cron is failing"
      label: "schedule-alarm:repo-policy"
      outcome: success
