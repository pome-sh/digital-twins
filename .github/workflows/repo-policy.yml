name: repo-policy

# Asserts main's live branch rules on a weekly cron and on any PR that touches them.
# When changing the required contexts, land config/required-checks.json first and
# accept a red here until the ruleset is updated by hand; the other order leaves
# every PR waiting on a check that never runs.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/ci/assert-repo-policy.sh"
      - "scripts/ci/assert-repo-policy.test.mjs"
      - "config/required-checks.json"
      - ".github/workflows/repo-policy.yml"
      - ".github/workflows/dependency-review.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/secret-scan.yml"

permissions:
  contents: read

jobs:
  assert:
    name: assert main protection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regression-test policy validator
        run: node scripts/ci/assert-repo-policy.test.mjs
      - name: Assert live branch protection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/ci/assert-repo-policy.sh

  schedule-alarm:
    needs: assert
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/schedule-alarm.yml
    with:
      title: "the repo-policy weekly cron is failing"
      label: "schedule-alarm:repo-policy"
      outcome: failure
      detail: "repo-policy.yml's scheduled run failed. It needs no credential beyond the ambient GITHUB_TOKEN, so check the run log for the actual assertion in scripts/ci/assert-repo-policy.sh that broke."

  schedule-alarm-recovery:
    needs: assert
    if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/schedule-alarm.yml
    with:
      title: "the repo-policy weekly cron is failing"
      label: "schedule-alarm:repo-policy"
      outcome: success
