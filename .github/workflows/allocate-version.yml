name: allocate version

# Reads main's tip, allocates the version numbers it earned, pushes ONE commit back.
# Does not publish: the bump commit's own release.yml run does that.
#
# The push uses the pome-ops-push App token, not GITHUB_TOKEN, for two independent
# reasons: `github-actions` can never be a ruleset bypass actor, and a push made
# with GITHUB_TOKEN triggers no workflows — so the number would land and nothing
# would publish it. A missing secret must fail loud, never fall back.

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [repin-examples]
  pull_request:
    paths:
      - "scripts/ci/allocate-release-versions.mjs"
      - "scripts/ci/allocate-release-versions.test.mjs"
      - "scripts/ci/changelog-entry.mjs"
      - "scripts/ci/publish-relevance.mjs"
      - "scripts/check-example-pins-published.mjs"
      - "scripts/lint/rules/workspace-pins.mjs"
      - ".github/workflows/allocate-version.yml"

concurrency:
  group: allocate-version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  allocate:
    name: write the version numbers this push earned
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[release-bump]') }}
    steps:
      - name: The pome-ops-push credentials must exist
        if: github.event_name != 'pull_request'
        env:
          OPS_APP_ID: ${{ secrets.OPS_APP_ID }}
          OPS_APP_PRIVATE_KEY: ${{ secrets.OPS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPS_APP_ID}" || -z "${OPS_APP_PRIVATE_KEY}" ]]; then
            echo "::error::OPS_APP_ID / OPS_APP_PRIVATE_KEY are not both set, so no version can be allocated and nothing will publish."
            echo "These are the org's pome-ops-push GitHub App (app_id 4582446). Three one-time steps,"
            echo "in this order:"
            echo "  1. App installation -> Repository access includes pome-sh/digital-twins (UI only)."
            echo "  2. Generate a SECOND private key (pome-cloud holds the first, write-only), then"
            echo "     gh secret set OPS_APP_ID / OPS_APP_PRIVATE_KEY on this repository."
            echo "  3. Add the app to ruleset 18797095's bypass_actors as actor_type Integration."
            echo "Step 3 answers 422 before step 1 is done. The ambient GITHUB_TOKEN cannot stand in:"
            echo "it can never be a ruleset bypass actor, and a push made with it does not trigger release.yml."
            exit 1
          fi

      - name: Mint a pome-ops-push installation token
        id: app-token
        if: github.event_name != 'pull_request'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPS_APP_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ref is per arm. On a push, main (the moving tip). On a pull_request, the
          # merge ref — a checkout of main has none of the PR's own files.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          # Load-bearing: the allocator asks when a version last moved and a truncated walk
          # silently mis-scopes which packages are owed a release.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regression-test the allocator
        run: node scripts/ci/allocate-release-versions.test.mjs

      - name: What would this push allocate?
        if: github.event_name == 'pull_request'
        run: node scripts/ci/allocate-release-versions.mjs

      - name: Allocate, write, and push one commit to main
        if: github.event_name != 'pull_request'
        env:
          PLAN: ${{ runner.temp }}/allocation.json
          MESSAGE: ${{ runner.temp }}/allocation-message.txt
          REGEN: ${{ runner.temp }}/allocation-regenerate.sh
        run: |
          set -euo pipefail
          # The commit AUTHOR is cosmetic; the ruleset bypass keys on the PUSHER, which
          # is the pome-ops-push installation whose token checkout stored above.
          git config user.name "pome release bot"
          git config user.email "release-bot@pome.sh"

          # Three attempts, each RECOMPUTING rather than retrying a stale write: the
          # allocator is a pure function of the tip, so re-planning after a rejected
          # push is the only way to fold in the merge that beat us to it.
          for attempt in 1 2 3; do
            # Explicit destination refspec rather than a bare `git fetch origin main`:
            # which remote-tracking ref that updates depends on the refspec
            # actions/checkout happened to configure, and resetting to a stale
            # origin/main would re-plan against the tip we are trying to leave.
            git fetch --quiet --force origin main:refs/remotes/origin/main
            git reset --quiet --hard refs/remotes/origin/main

            node scripts/ci/allocate-release-versions.mjs \
              --write --plan-out "${PLAN}" --message-out "${MESSAGE}" --regen-out "${REGEN}"

            if git diff --quiet; then
              echo "Nothing to allocate at $(git rev-parse --short HEAD) — no commit, no publish."
              exit 0
            fi

            # Committed artifacts that embed their package's own version and are
            # byte-compared by a required gate — today only wire's trace-contract.json.
            # The command comes from the table beside the artifact
            # (scripts/ci/publish-relevance.mjs), so a second one needs no edit here. An
            # empty file means no package in this plan has one, which is why `npm ci` is
            # inside the guard.
            if [[ -s "${REGEN}" ]]; then
              echo "Regenerating version-embedding artifacts:"
              cat "${REGEN}"
              npm ci --no-audit --no-fund
              bash "${REGEN}"
            fi

            # `-a` is safe here: a fresh checkout whose only writers are the allocator
            # and the regeneration above.
            git commit --quiet -a --file "${MESSAGE}"

            push_err="${RUNNER_TEMP}/push-attempt-${attempt}.err"
            if git push --quiet origin HEAD:main 2>"${push_err}"; then
              echo "Allocated on main:"
              cat "${MESSAGE}"
              exit 0
            fi
            cat "${push_err}" >&2

            # A refusal is not a race. A rule violation (GH013) answers identically to a
            # lost race from the loop's point of view, and retrying cannot fix a rule —
            # the only useful move is to stop and name the layer that refused.
            if grep -qE 'GH013|GH006|rule violations|protected branch|refusing to allow' "${push_err}"; then
              echo "::error::main REFUSED this push on a RULE, not a race (attempt ${attempt}/3). Retrying cannot help, so this run stops here."
              echo "Nothing was published and nothing was lost: the pending CHANGELOG entries are still on"
              echo "main, and release-alarm.yml reports this as UNALLOCATED within a day."
              echo "Every layer guarding main must let the pome-ops-push app (app_id 4582446) through:"
              echo "  - ruleset 18797095 'main founder-bypass' — needs the app in bypass_actors as actor_type Integration;"
              echo "  - CLASSIC branch protection — CANNOT be bypassed by an app at all, so it must carry no"
              echo "    required_status_checks rule (deleted 2026-08-13; a re-added one breaks this workflow again)."
              exit 1
            fi

            echo "::warning::push to main was rejected on attempt ${attempt}/3 (non-fast-forward — a merge landed first). Recomputing from the new tip."
          done

          echo "::error::Could not land the version allocation after three attempts, each losing a race to a"
          echo "new merge. Nothing published; the pending CHANGELOG entries are still on main, so"
          echo "release-alarm.yml will report this within a day (UNALLOCATED). Re-run this workflow once"
          echo "main is quiet."
          exit 1
