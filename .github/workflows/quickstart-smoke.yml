name: quickstart-smoke

# The README quickstart, end to end, with env-only auth. The twins here are
# workspace tarballs, not an npx user's published pins — do not read this as
# coverage of those.
on:
  pull_request:
    paths:
      - 'README.md'
      - 'agent-examples/triage-agent/**'
      - 'packages/wire/**'
      - 'packages/sdk/**'
      - 'packages/twin-github/**'
      - 'packages/twin-gmail/**'
      - 'packages/adapter-claude-sdk/**'
      - 'package.json'
      - 'package-lock.json'
      - 'cli/**'
      - '.github/workflows/quickstart-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'agent-examples/triage-agent/**'
      - 'packages/wire/**'
      - 'packages/sdk/**'
      - 'packages/twin-github/**'
      - 'packages/twin-gmail/**'
      - 'packages/adapter-claude-sdk/**'
      - 'package.json'
      - 'package-lock.json'
      - 'cli/**'
      - '.github/workflows/quickstart-smoke.yml'
  workflow_dispatch:

concurrency:
  group: quickstart-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent-examples/triage-agent/package-lock.json
      - run: npm ci
      - run: npm run build -w @pome-sh/wire
      - run: npm run build -w @pome-sh/adapter-claude-sdk
      - name: Auth-token unit test
        working-directory: agent-examples/triage-agent
        run: |
          npm ci
          npm test
      - name: Build the CLI from this checkout
        run: npm run build
      - name: Generate the shared twin auth secret
        run: echo "TWIN_AUTH_SECRET=$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')" >> "$GITHUB_ENV"
      - name: Start the GitHub twin via the CLI
        run: |
          nohup node cli/dist/src/cli/main.js twin start github > twin.log 2>&1 &
      - name: Wait for twin health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3333/healthz >/dev/null 2>&1; then
              echo "twin ready after ${i} tries"; exit 0
            fi
            sleep 2
          done
          echo "::error::twin health not ready within 120s"
          cat twin.log
          exit 1
      - name: Quickstart preflight (env-secret JWT mint + reach twin)
        working-directory: agent-examples/triage-agent
        env:
          POME_PREFLIGHT: "1"
          ANTHROPIC_API_KEY: "sk-ant-preflight-not-used"
        run: npm start
      - name: Gmail quickstart boot and token alias
        run: |
          nohup node cli/dist/src/cli/main.js twin start gmail --port 3336 > gmail-twin.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3336/healthz >/dev/null 2>&1; then
              grep -q '^POME_GMAIL_REST_URL=' gmail-twin.log
              grep -q '^POME_GMAIL_MCP_URL=' gmail-twin.log
              grep -q '^POME_GMAIL_TOKEN=' gmail-twin.log
              exit 0
            fi
            sleep 1
          done
          cat gmail-twin.log
          exit 1
      - name: Twin logs on failure
        if: failure()
        run: cat twin.log gmail-twin.log 2>/dev/null || true
