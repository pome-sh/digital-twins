name: release alarm

# A failed release must reach a human without a human going looking.
#
# `release.yml` has no failure path of its own, so a publish that died reads
# exactly like a merge that owed no publish, and the first signal is somebody
# noticing a package missing from npm.
#
# ── Why this is a SEPARATE workflow file ─────────────────────────────────
#
# The alarm has to survive the thing it watches. An `if: failure()` step inside
# `release.yml` cannot see the worse silence — a release workflow that never
# triggers at all takes an embedded check down with it, and reports nothing.
#
# ── Why it lives in digital-twins and not in pome-cloud ──────────────────────
#
# A real choice; pome-cloud is the consumer that CARES whether `@pome-sh/checks`
# published, and an alarm in the repo whose CI is broken can be broken by the
# same cause. Four reasons it belongs here anyway:
#
#   1. Shared fate does not actually favour pome-cloud. The causes that would
#      take this workflow down with `release.yml` — Actions disabled, billing
#      exhausted, the org suspended — are ORG-scoped, and pome-cloud is the same
#      org and the same billing account. Moving the alarm one repo sideways buys
#      protection only against someone disabling Actions on this repo alone,
#      while costing everything below. The failure class this watches for — an
#      npm Trusted Publishing identity mismatch, a publish step that throws —
#      lives entirely inside `release.yml` and cannot touch a
#      separately-triggered sibling.
#   2. The issue has to be filed where the fix happens. `issues: write` is
#      per-repo: filing into digital-twins from pome-cloud needs a long-lived
#      cross-repo PAT in pome-cloud's secrets — the exact credential
#      `vocabulary-parity.yml` refused to introduce in the other direction. The
#      alternative, filing in pome-cloud, puts the alarm in the repo that cannot
#      act on it: every recovery (re-dispatch `release.yml`, repair the npm
#      Trusted Publisher) is a digital-twins operation.
#   3. One of the five publish targets is only readable from here. `@pome-sh/wire`
#      on GitHub Packages needs a token even to READ a version, and the ambient
#      `packages: read` below covers it exactly as `release.yml`'s `plan-wire`
#      job does. A pome-cloud alarm would need another PAT or would carry a
#      blind spot on a fifth of what it watches, which is the whole point.
#   4. This repo is public, so its Actions minutes are free; pome-cloud's are
#      billed. Smallest of the four, but it points the same way.
#
# ── Both directions ──────────────────────────────────────────────────────────
#
# Everything green produces no issue, no comment, and a green run, and a
# recovered failure CLOSES the tracking issue. An alarm that cries wolf gets
# muted, and a stale open issue teaches people to skim past the next real one.
on:
  schedule:
    # Daily, off the top of the hour to dodge GitHub's cron-queue congestion.
    # Daily rather than hourly because the bar in the ticket is "a signal a
    # human receives within a day", and because the outcome this checks —
    # is the package on the registry — does not become more true at 03:00.
    #
    # The one thing that can silence THIS file: GitHub disables scheduled
    # workflows in a repository after 60 days with no commits. That is a
    # property of the repo, not of the release, and it is why `--targets` and
    # the regression suite also run in ci.yml on every PR — a repo quiet enough
    # to lose its cron is a repo whose release nobody is triggering either.
    - cron: "37 6 * * *"
  workflow_dispatch:
  # Changing the checker or its subject must prove the checker still parses on
  # the PR that changes it. ci.yml runs the same two commands in its always-on
  # block (they need no network and cannot be skipped); this arm additionally
  # proves THIS FILE's job wiring still works, which is the part a syntax-valid
  # workflow can get wrong and only discover at the next cron.
  pull_request:
    paths:
      - "scripts/ci/release-alarm.mjs"
      - "scripts/ci/release-alarm.test.mjs"
      - ".github/workflows/release-alarm.yml"
      - ".github/workflows/release.yml"
      - "scripts/ci/decide-publish.sh"

concurrency:
  group: release-alarm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alarm:
    name: every version main declares is on its registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Declared even though this repo is public and its runs are publicly
      # readable: a `permissions:` block sets every scope it omits to `none`,
      # and an alarm that silently 403s on the run list is an alarm that
      # reports the release path healthy because it could not see it.
      actions: read
      issues: write # the tracking issue
      packages: read # @pome-sh/wire's GitHub Packages version, as plan-wire reads it
    # whether this job's OWN mechanism ever reached a verdict, for
    # the meta-alarm job below. 'success' or 'failure' both mean the mechanism
    # worked and evaluated the release, whether or not it liked what it found.
    #
    # ANY OTHER VALUE means it never got that far, and the meta-alarm keys off
    # exactly that — "not one of the two verdicts" — rather than off empty.
    # There are two distinct non-verdict values and an earlier revision of this
    # file only handled the rarer one:
    #   'skipped' — the step was reached but its condition was false. A step
    #     carrying an explicit `if:` still gets an implicit `success()`, so a
    #     failed checkout / setup-node / regression suite / --targets dead-guard
    #     SKIPS `check` and records 'skipped'. This is the common case, and the
    #     one the meta-alarm exists for.
    #   '' — `steps.check` is absent from the context entirely, i.e. the job
    #     died before the runner got to that step at all (a "Set up job"
    #     failure, a runner fault).
    # Note also that `check` is `continue-on-error: true`, so `outcome` (not
    # `conclusion`) is the field that carries the real verdict.
    outputs:
      checked: ${{ steps.check.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Gate on the checker's own tests BEFORE checking, so a red run is a real
      # claim about the release and not a broken checker.
      - name: Regression-test the checker
        run: node scripts/ci/release-alarm.test.mjs

      # The dead-guard assertion: release.yml still yields publish targets. An
      # alarm whose package list has quietly gone empty passes forever.
      - name: The publish targets are still derivable from release.yml
        run: node scripts/ci/release-alarm.mjs --targets

      # Auth for the GitHub Packages READ only — never a `@pome-sh:registry=`
      # scope mapping, which would redirect every @pome-sh/* read (including
      # cli's and the adapter's) to a registry where they do not exist and make
      # each look brand new. `$HOME/.npmrc` so the token never sits in the
      # workspace. Same shape as release.yml's plan-wire job.
      - name: Authenticate reads against GitHub Packages
        if: github.event_name != 'pull_request'
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '//npm.pkg.github.com/:_authToken=%s\n' "${GITHUB_PACKAGES_TOKEN}" >> "$HOME/.npmrc"

      # Reads live registry and run state, so it only means anything off a PR
      # branch — a PR checkout is not main, and its manifests are not what
      # release.yml will publish.
      - name: Did every version main declares actually reach its registry?
        id: check
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/release-alarm.mjs

      # Scoped to the check step's own outcome rather than a bare `if: failure()`
      # so a checkout or runner fault does not file a confident "the release is
      # broken" issue about a check that never ran.
      - name: File or update the tracking issue
        if: steps.check.outcome == 'failure'
        continue-on-error: true # alerting must never be the reason the job is red
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Empty when the checker died before reaching a verdict (a throw, a gh
          # failure). Saying so beats printing nothing on an issue filed because
          # something is wrong.
          ALARM_REASON: ${{ steps.check.outputs.reason }}
          ALARM_REPORT: ${{ steps.check.outputs.report }}
        run: |
          set -u
          title="The twins release is not delivering"

          gh label create release-alarm \
            --color B60205 \
            --description "release.yml failed, never ran, or published nothing" \
            --repo "$GITHUB_REPOSITORY" || true

          # Built in a file so this step's YAML indentation cannot leak into the
          # issue body. The static half is a QUOTED heredoc: it is markdown full
          # of backticks, and nothing in it should ever be expanded by the shell.
          body="$(mktemp)"
          {
            printf '%s\n\n' "${ALARM_REASON:-The release alarm failed before it reached a verdict — see the run log.}"
            cat <<'MD'
          <details><summary>What the alarm read</summary>

          ```
          MD
            printf '%s\n' "${ALARM_REPORT:-(no report was produced)}"
            cat <<'MD'
          ```

          </details>

          **UNPUBLISHED / BEHIND** — a version on `main` that its registry does not serve. Check the `allocate-version.yml` and `release.yml` runs, the `OPS_APP_ID` / `OPS_APP_PRIVATE_KEY` secrets, and that the `pome-ops-push` app (app_id 4582446) is still both installed on this repository and in ruleset 18797095's bypass list. Re-dispatch once the cause is fixed: `gh workflow run release.yml --ref main` — do NOT hand-write the version to unstick it. A 404 at the publish step is an AUTH failure (npm Trusted Publishing matches repo *and* workflow filename), not a missing package.

          **NEVER_RAN** — a push to `main` that triggered no release at all. Check Actions is enabled, and whether the push came from a bot using the ambient `GITHUB_TOKEN`, which GitHub refuses to let trigger workflows.

          **STUCK** — `release.yml` sets `cancel-in-progress: false`, so one hung run holds the concurrency lock and every release behind it waits.

          **UNMEASURED** — the alarm could not read a registry. That is not the same claim as "unpublished"; nothing is known about that package yet.

          MD
            printf 'Detected by release-alarm: %s\n\n' "$RUN_URL"
            printf 'This issue is reused across consecutive failures (commented on, not re-filed) and closes itself once the release delivers again — so a release that stays broken stays visible instead of burying itself.\n'
          } > "$body"

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-alarm \
            --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            { printf 'Still not delivering on the latest run.\n\n'; cat "$body"; } > "${body}.c"
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "${body}.c" || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body-file "$body" --label release-alarm \
            || gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body" || true
          fi

      # The other direction. Without this the tracking issue outlives the
      # problem, and an open issue nobody closes is how a label stops being read
      # — which is this ticket's own defect wearing a different hat.
      - name: Close the tracking issue once the release delivers again
        if: steps.check.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALARM_REPORT: ${{ steps.check.outputs.report }}
        run: |
          set -u
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-alarm \
            --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -z "$existing" ]; then
            echo "Release is delivering and no tracking issue is open — nothing to say."
            exit 0
          fi
          body="$(mktemp)"
          {
            cat <<'MD'
          Delivering again: every version `main` declares is on its registry, and the release path is alive.

          <details><summary>What the alarm read</summary>

          ```
          MD
            printf '%s\n' "${ALARM_REPORT:-(no report was produced)}"
            cat <<'MD'
          ```

          </details>

          MD
            printf 'Closed by release-alarm: %s\n' "$RUN_URL"
          } > "$body"
          gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body" || true
          gh issue close "$existing" --repo "$GITHUB_REPOSITORY" || true

      # `continue-on-error` above keeps the job green so alerting failures never
      # masquerade as release failures — so the run's own conclusion has to be
      # set here, or a red release would show a green check and we are back to
      # silence with extra steps.
      - name: Fail the run when the alarm fired
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::The release alarm fired — see the tracking issue and the step log above."
          exit 1

  # who watches the watchman. `alarm`'s job conclusion is 'failure'
  # in two different situations that must not be reported the same way: the
  # deliberate last step above exiting 1 because it correctly found the
  # release broken (already communicated via the "twins release is not
  # delivering" issue — not this job's problem to also alarm about), and
  # checkout/setup-node/the regression suite/the --targets dead-guard failing
  # BEFORE `check` ever ran, which means the mechanism itself is broken and
  # said nothing about the release either way. `outputs.checked` distinguishes
  # them: it is 'success' or 'failure' exactly when `check` reached a verdict
  # (the mechanism worked, whatever it found), and anything else — 'skipped'
  # when a preceding step failed and took `check`'s implicit `success()` with
  # it, '' when the job died before the step existed in the context at all —
  # means it never got the chance. Testing for "not one of the two verdicts"
  # rather than for `== ''` is deliberate: 'skipped' is the COMMON case and an
  # `== ''` test would have made this job unfireable in precisely the
  # situation it was written for. Gated off pull_request because `check` is
  # deliberately skipped there and a non-verdict on a PR run is expected, not
  # a mechanism outage.
  #
  # NOT covered by design, so as not to overstate this: `release-alarm.mjs`
  # THROWING once `check` is running yields outcome 'failure', which is
  # indistinguishable here from "the release is not delivering". That case is
  # handled inside the job instead — the tracking-issue body prints
  # `(no reason was produced)` when the checker died before a verdict.
  meta-alarm:
    needs: alarm
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.alarm.result == 'failure' &&
      needs.alarm.outputs.checked != 'success' &&
      needs.alarm.outputs.checked != 'failure'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/schedule-alarm.yml
    with:
      title: "the release alarm's own mechanism is broken"
      label: "schedule-alarm:release-alarm"
      outcome: failure
      detail: "release-alarm.yml failed before its own check step ever ran — checkout, setup-node, the regression suite (scripts/ci/release-alarm.test.mjs), or the --targets dead-guard broke, so this run said nothing about whether the release is actually delivering. See the run log for which step failed."

  # The exact negation of `meta-alarm`'s gate, and deliberately NOT also
  # requiring `needs.alarm.result == 'success'`. The fact this alarm tracks is
  # "did the mechanism reach a verdict", which `checked` alone answers. Also
  # requiring a green job would mean that once the mechanism broke and filed,
  # a subsequent run that worked perfectly but found the release genuinely
  # broken (verdict 'failure', so the job reds on purpose) closes nothing — and
  # since a real release outage is exactly when release-alarm.yml is red for a
  # stretch, the "mechanism is broken" issue would sit open, contradicted and
  # unread, for the whole stretch.
  meta-alarm-recovery:
    needs: alarm
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (needs.alarm.outputs.checked == 'success' || needs.alarm.outputs.checked == 'failure')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/schedule-alarm.yml
    with:
      title: "the release alarm's own mechanism is broken"
      label: "schedule-alarm:release-alarm"
      outcome: success
