name: release alarm

# Daily check that every version main declares reached its registry. A separate file
# on its own cron, because the alarm has to survive a release.yml that never ran.
# The pull_request arm proves this file's own job wiring still works.

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/ci/release-alarm.mjs"
      - "scripts/ci/release-alarm.test.mjs"
      - ".github/workflows/release-alarm.yml"
      - ".github/workflows/release.yml"
      - "scripts/ci/decide-publish.sh"
      - "scripts/ci/changelog-entry.mjs"
      - "scripts/ci/publish-relevance.mjs"

concurrency:
  group: release-alarm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alarm:
    name: every version main declares is on its registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write # the tracking issue
      packages: read # @pome-sh/wire's GitHub Packages version, as plan-wire reads it
    outputs:
      checked: ${{ steps.check.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Regression-test the checker
        run: node scripts/ci/release-alarm.test.mjs

      - name: The publish targets are still derivable from release.yml
        run: node scripts/ci/release-alarm.mjs --targets

      - name: Authenticate reads against GitHub Packages
        if: github.event_name != 'pull_request'
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '//npm.pkg.github.com/:_authToken=%s\n' "${GITHUB_PACKAGES_TOKEN}" >> "$HOME/.npmrc"

      - name: Did every version main declares actually reach its registry?
        id: check
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/release-alarm.mjs

      - name: File or update the tracking issue
        if: steps.check.outcome == 'failure'
        continue-on-error: true # alerting must never be the reason the job is red
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALARM_REASON: ${{ steps.check.outputs.reason }}
          ALARM_REPORT: ${{ steps.check.outputs.report }}
        run: |
          set -u
          title="The twins release is not delivering"

          gh label create release-alarm \
            --color B60205 \
            --description "release.yml failed, never ran, or published nothing" \
            --repo "$GITHUB_REPOSITORY" || true

          # Built in a file so this step's YAML indentation cannot leak into the
          # issue body. The static half is a QUOTED heredoc: it is markdown full
          # of backticks, and nothing in it should ever be expanded by the shell.
          body="$(mktemp)"
          {
            printf '%s\n\n' "${ALARM_REASON:-The release alarm failed before it reached a verdict — see the run log.}"
            cat <<'MD'
          <details><summary>What the alarm read</summary>

          ```
          MD
            printf '%s\n' "${ALARM_REPORT:-(no report was produced)}"
            cat <<'MD'
          ```

          </details>

          **UNALLOCATED** — `main` carries a pending `## Unreleased` entry and no version number was written for it, so nothing published and `main` and the registry agree on the old version. The number is allocated after the merge by `allocate-version.yml`: check that run, the `OPS_APP_ID` / `OPS_APP_PRIVATE_KEY` secrets, and that the `pome-ops-push` app (app_id 4582446) is still both installed on this repository and in ruleset 18797095's bypass list. Recovery is `gh workflow run allocate-version.yml --ref main` — do NOT hand-write the version to unstick it.

          **UNPUBLISHED / BEHIND** — a version on `main` that its registry does not serve. Re-dispatch the release once the cause is fixed: `gh workflow run release.yml --ref main`. A 404 at the publish step is an AUTH failure (npm Trusted Publishing matches repo *and* workflow filename), not a missing package.

          **NEVER_RAN** — a push to `main` that triggered no release at all. Check Actions is enabled, and whether the push came from a bot using the ambient `GITHUB_TOKEN`, which GitHub refuses to let trigger workflows.

          **STUCK** — `release.yml` sets `cancel-in-progress: false`, so one hung run holds the concurrency lock and every release behind it waits.

          **UNMEASURED** — the alarm could not read a registry. That is not the same claim as "unpublished"; nothing is known about that package yet.

          MD
            printf 'Detected by release-alarm: %s\n\n' "$RUN_URL"
            printf 'This issue is reused across consecutive failures (commented on, not re-filed) and closes itself once the release delivers again — so a release that stays broken stays visible instead of burying itself.\n'
          } > "$body"

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-alarm \
            --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            { printf 'Still not delivering on the latest run.\n\n'; cat "$body"; } > "${body}.c"
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "${body}.c" || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body-file "$body" --label release-alarm \
            || gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body" || true
          fi

      - name: Close the tracking issue once the release delivers again
        if: steps.check.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALARM_REPORT: ${{ steps.check.outputs.report }}
        run: |
          set -u
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-alarm \
            --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -z "$existing" ]; then
            echo "Release is delivering and no tracking issue is open — nothing to say."
            exit 0
          fi
          body="$(mktemp)"
          {
            cat <<'MD'
          Delivering again: every version `main` declares is on its registry, and the release path is alive.

          <details><summary>What the alarm read</summary>

          ```
          MD
            printf '%s\n' "${ALARM_REPORT:-(no report was produced)}"
            cat <<'MD'
          ```

          </details>

          MD
            printf 'Closed by release-alarm: %s\n' "$RUN_URL"
          } > "$body"
          gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body" || true
          gh issue close "$existing" --repo "$GITHUB_REPOSITORY" || true

      - name: Fail the run when the alarm fired
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::The release alarm fired — see the tracking issue and the step log above."
          exit 1

  meta-alarm:
    needs: alarm
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.alarm.result == 'failure' &&
      needs.alarm.outputs.checked != 'success' &&
      needs.alarm.outputs.checked != 'failure'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/schedule-alarm.yml
    with:
      title: "the release alarm's own mechanism is broken"
      label: "schedule-alarm:release-alarm"
      outcome: failure
      detail: "release-alarm.yml failed before its own check step ever ran — checkout, setup-node, the regression suite (scripts/ci/release-alarm.test.mjs), or the --targets dead-guard broke, so this run said nothing about whether the release is actually delivering. See the run log for which step failed."

  meta-alarm-recovery:
    needs: alarm
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (needs.alarm.outputs.checked == 'success' || needs.alarm.outputs.checked == 'failure')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/schedule-alarm.yml
    with:
      title: "the release alarm's own mechanism is broken"
      label: "schedule-alarm:release-alarm"
      outcome: success
