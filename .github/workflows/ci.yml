name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required check context is the job name `typecheck-test` (ruleset +
  # assert-repo-policy). The job MUST always run on every PR so the check is
  # never missing. Docs-only PRs run cheap dependency-free gates and skip the
  # npm ci / build / test / parity suite.
  typecheck-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the heavy suite is needed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "Running heavy suite (non-PR event)."
            exit 0
          fi
          # Paths that can affect package build/test/parity or the CI contract.
          if git diff --name-only "${BASE_SHA}" HEAD | grep -qE \
            '^(packages/|cli/|examples/|scripts/|contract/|config/|knip\.json|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "Running heavy suite (package/cli/script/lockfile/ci changes)."
          else
            echo "heavy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping heavy suite (docs/chore-only PR); required check stays green."
          fi
      # Cheap, dependency-free gates — always on so docs PRs still catch
      # copy-marker / barrel / cloud-import / policy fixture regressions.
      - run: node scripts/check-copy-markers.mjs
      - run: node scripts/lint-code-health.mjs
      - run: node scripts/check-first-party-twin-registration.mjs
      # release.yml only publishes on a version diff against npm — a PR that
      # changes a published package's source without bumping its version
      # merges clean and silently never reaches npm. Only meaningful against
      # the PR's actual base (a push to main has already merged).
      - if: github.event_name == 'pull_request'
        run: node scripts/ci/check-version-bump-required.mjs "${{ github.event.pull_request.base.sha }}"
      # F-1226 — the plugin manifest is what makes the `skills` installer render
      # one select-all row instead of six unticked checkboxes. It has to live in
      # the always-on block: adding a skill touches only `skills/`, which the
      # scope step above classifies as docs-only, so a heavy-block gate would be
      # skipped by exactly the PR that drifts it.
      - run: node scripts/check-plugin-manifest-lists-every-skill.mjs
      - run: node scripts/check-plugin-manifest-lists-every-skill.test.mjs
      # F-778 — the legacy D/P criterion markers are retired; fail on any
      # reintroduction outside the parser's own legacy-detection code.
      - run: node scripts/lint-legacy-criterion-markers.mjs
      # F-745 / D4 — no catch-and-continue in the SDK twin engine
      # (packages/sdk/src): every statement catch must throw, return an
      # error/sentinel, or reject. Dependency-free, runs before `npm ci`.
      - run: node scripts/no-catch-and-continue.mjs
      # F-1135 — cli/package.json's @pome-sh/* pins must equal packages/*'s
      # versions. CI tests the workspace build (the tarball rewrite) while users
      # install the published tarball, where those deps are bundleDependencies
      # and the pin is frozen at publish time. F-1132 shipped a CLI that refused
      # every `pome checks add` for github while cli-ci was green.
      # F-1126 — the same argument one directory over. npm only SYMLINKS a
      # sibling when the declared pin matches its version; otherwise it installs
      # a real nested copy from the registry, and that package is built and
      # tested against the PUBLISHED artifact instead of this tree. twin-slack
      # pinned sdk 0.5.1 against a workspace on 0.9.0 for months, and
      # adapter-claude-sdk pinned shared-types one minor back. CI was green
      # throughout — everything it ran genuinely passed, against the wrong sdk.
      - run: node scripts/check-workspace-pins-match-workspace.mjs
      - run: bash scripts/lint-no-cloud-imports.sh
      - run: bash scripts/lint-no-cloud-imports.test.sh
      - run: node scripts/ci/wait-for-workflow.test.mjs
      - run: node scripts/ci/assert-repo-policy.test.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.heavy == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install, build, test, contract, fidelity
        if: steps.scope.outputs.heavy == 'true'
        run: |
          set -euo pipefail
          npm ci
          npm run lint:dead-code
          # F-705 — zero native deps is an invariant: no gyp-marked package in the
          # production closure (prebuilt installers like esbuild/fsevents pass).
          npm run gate:no-native
          # F-692 / D9 — one repo-wide capture-only gate, scanning cli/src/**,
          # cli/scripts/**, and packages/** (cli-ci.yml's former duplicate step
          # was folded in here).
          npm run gate:no-eval
          # F-1201 — the contract now enumerates the event union from zod and
          # requires a fixture per kind, so a new kind with none reds this line.
          # Before that it compared bytes no schema change could move.
          npm run check:trace-contract -w @pome-sh/wire
          node packages/wire/scripts/emit-trace-contract.test.mjs
          # F-1200 — `parent_id` meant four different things across five writers.
          # The schema still ACCEPTS it so stored 0.13.0 rows keep parsing, which
          # is exactly why the gate lives here: zod cannot tell a reader from a
          # writer, so nothing else stops a new emitter reintroducing it.
          npm run lint:parent-vocab
          node scripts/lint-parent-vocab.test.mjs
          # F-1302 — every shipped task declares which POPULATION it is in:
          # `conformance` (does our fake GitHub answer correctly) versus the exam
          # half, `restraint` + `adversarial` (is the agent any good). pome-cloud
          # pins its scored denominators against the exam half, so a task landing
          # here unclassified would silently join whichever population the reader
          # assumed and blend two averages back into one.
          npm run lint:task-class
          node scripts/lint-task-class.test.mjs
          # F-818 — the committed manifest JSON Schema (served at
          # pome.sh/schemas/v1/pome.json) must match the zod source.
          npm run check:manifest-schema -w @pome-sh/cli
          # Consumers import sibling packages through their published `exports`
          # (e.g. `@pome-sh/sdk/server` → dist/server.d.ts). Build the workspace in
          # dependency order so those subpaths resolve before typecheck/test.
          npm run build
          npm run typecheck
          # F-866 — the bundled examples/ projects are standalone npm packages
          # (own lockfiles), not workspaces, so `npm run typecheck` above misses
          # them. Typecheck each against the just-built adapter so a zod-4 / SDK
          # `tool()` typing regression can't sit latent again.
          npm run typecheck:examples
          # F-900 — tsc cannot see a temporal-dead-zone crash: typecheck:examples
          # was green while every real launch of examples/triage-agent died with
          # `Cannot access 'TwinMcpClient' before initialization` (top-level
          # `await main()` ran above the class it uses). Launch each example for
          # real (POME_PREFLIGHT unset) and fail if it crashes on load.
          npm run smoke:examples
          # F-1152 — the two gates above each stop short of a twin call:
          # typecheck:examples is green on a well-typed tool whose endpoint
          # 404s, and smoke:examples returns before any tool fires because a
          # real run needs a model. Both examples/pr-summary-agent and
          # examples/pr-summary-review shipped a `comment_on_pull_request` the
          # GitHub twin answered `404 Issue not found` for, on every subject,
          # for as long as they existed. Boot each example's declared twins on
          # its own task seed and invoke every registered tool once — no model.
          npm run probe:examples
          node scripts/probe-example-tools.test.mjs
          # twin-github runs with coverage thresholds (90% lines/funcs/statements)
          # instead of a second plain `npm test` pass for that workspace.
          npm test -w @pome-sh/wire -w @pome-sh/sdk -w @pome-sh/adapter-claude-sdk -w @pome-sh/twin-slack -w @pome-sh/twin-stripe -w @pome-sh/twin-gmail -w @pome-sh/twin-linear
          npm run test:coverage -w @pome-sh/twin-github
          # Former cli-ci.yml (folded in here — one required check, one npm ci).
          npm test -w @pome-sh/cli
          # Every internal @pome-sh/* package is INLINED into the published CLI
          # bundle, so its own `dependencies` are never installed for it: a
          # third-party import the CLI does not declare (twin-linear needs
          # `graphql`) becomes ERR_MODULE_NOT_FOUND inside a lazily-loaded twin
          # chunk, on that twin only.
          npm run gate:bundled-deps
          # Black-box twin runtime-contract suite (FDRS-711). Spawns the BUILT twins
          # via plain `node` — Node 24 to match the GHCR runtime image — and asserts
          # the control-plane surface frozen in CONTRACT.md.
          npm run test:contract
          # F-730 — fidelity:parity across first-party twins.
          npm run fidelity:parity -w @pome-sh/twin-github -w @pome-sh/twin-slack -w @pome-sh/twin-stripe -w @pome-sh/twin-gmail -w @pome-sh/twin-linear
      # F-709 — the frozen M1 runtime-contract assertions, asserted against
      # twins started via the CLI front door (`pome twin start <twin>`).
      # Separate step so a failure here is not buried in the block above. The
      # bundled CLI is self-contained (it owns cli/src/contract and inlines
      # @pome-sh/wire), so unlike the packaged twins it resolves nothing from a
      # sibling workspace at runtime.
      - name: Contract suite vs pome twin start
        if: steps.scope.outputs.heavy == 'true'
        run: node --test contract/cli-start.test.mjs
      # The release gate, run on every PR: pack both published packages, install
      # them in clean rooms with no access to this workspace, boot ALL FIVE twins
      # from the CLI tarball, and typecheck a real consumer against the adapter's
      # shipped declarations. This is the check that `bundleDependencies` never
      # had — it declared seven bundled packages, shipped none, and npm reported
      # a successful install.
      - name: Clean-room pack test (both published packages)
        if: steps.scope.outputs.heavy == 'true'
        run: npm run test:pack
      - name: Heavy suite skipped (docs/chore-only)
        if: steps.scope.outputs.heavy != 'true'
        run: echo "Required check typecheck-test is green without npm ci — no package/script changes in this PR."
