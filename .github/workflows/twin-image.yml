name: twin image
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/twin-github/**'
      - 'packages/twin-gmail/**'
      - 'packages/twin-linear/**'
      - 'packages/twin-slack/**'
      - 'packages/twin-stripe/**'
      - 'packages/wire/**'
      # `packages/sdk/**` for the same reason as wire, and it was missing: every
      # Dockerfile's runtime stage carries `COPY --from=build
      # /repo/packages/sdk/dist`, and all five twins declare `@pome-sh/sdk`. A
      # PR touching only `packages/sdk/src/` therefore changed the shipped bytes
      # of all five images and ran no build and no Trivy scan — the regression
      # surfaced on main, after the merge, where it blocks a publish instead of
      # a PR. `packages/*/package.json` below covers only the manifest.
      - 'packages/sdk/**'
      - 'packages/*/package.json'
      - 'package.json'
      - 'package-lock.json'
      # The twin Dockerfiles COPY cli/package.json so `npm ci` can see every
      # workspace manifest named in the lockfile.
      - 'cli/package.json'
      - '.dockerignore'
      - '.trivyignore'
      - 'scripts/ci/wait-for-workflow.sh'
      - 'scripts/ci/wait-for-workflow.test.mjs'
      - 'scripts/ci/sign-image-digests.sh'
      # `.github/workflows/ci.yml` is deliberately NOT here. It was, because
      # `wait-gates` below waits for that workflow — but that wait is now
      # non-PR only, so on a pull request nothing in this file reads ci.yml at
      # all. Listing it meant every CI-only PR hit `detect-twins`'s
      # `.github/workflows/*` shared-input case and built + Trivy-scanned all
      # five images to publish none of them. A ci.yml edit cannot change what
      # goes into a twin image.
      - '.github/workflows/twin-image.yml'
  workflow_dispatch:

jobs:
  # On PRs, build only twins whose package tree (or shared runtime inputs)
  # changed. main/dispatch always build the full matrix so GHCR stays
  # coherent. @pome-sh/wire / lockfiles / Docker wiring ⇒ all twins. (The cloud
  # contract in cli/src/contract is deliberately NOT here: no twin imports it.)
  #
  # FIRST_PARTY_TWINS: github, slack, stripe, gmail, linear
  detect-twins:
    name: twin image (select matrix)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      twins: ${{ steps.detect.outputs.twins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select twin matrix
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          all='["github","slack","stripe","gmail","linear"]'
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "twins=${all}" >> "$GITHUB_OUTPUT"
            echo "Full twin matrix (non-PR event)."
            exit 0
          fi
          mapfile -t files < <(git diff --name-only "${BASE_SHA}" HEAD)
          shared=false
          for f in "${files[@]}"; do
            case "$f" in
              packages/wire/*|packages/sdk/*|package.json|package-lock.json|cli/package.json|.dockerignore|.trivyignore|scripts/ci/*|.github/workflows/twin-image.yml|packages/*/package.json)
                shared=true
                break
                ;;
            esac
          done
          if [[ "${shared}" == "true" ]]; then
            echo "twins=${all}" >> "$GITHUB_OUTPUT"
            echo "Full twin matrix (shared runtime / workflow inputs changed)."
            exit 0
          fi
          selected=()
          for twin in github slack stripe gmail linear; do
            for f in "${files[@]}"; do
              if [[ "$f" == packages/twin-${twin}/* ]]; then
                selected+=("\"${twin}\"")
                break
              fi
            done
          done
          if [[ "${#selected[@]}" -eq 0 ]]; then
            # Path filter admitted the PR but no twin package matched — a
            # shared or ambiguous input, so verify all five rather than none.
            echo "twins=${all}" >> "$GITHUB_OUTPUT"
            echo "Full twin matrix (fallback)."
            exit 0
          fi
          printf -v joined '%s,' "${selected[@]}"
          echo "twins=[${joined%,}]" >> "$GITHUB_OUTPUT"
          echo "PR twin matrix: [${joined%,}]"

  # Package typecheck/test live in `ci`; secret scanning is a parallel gate.
  # Wait for both on this SHA before pushing, so a red twin cannot ship a
  # rolling tag to GHCR. Both waits are now off-PR (see each step's `if:`):
  # nothing is pushed from a pull request, so there was no push to order.
  #
  # The secret-scan wait carries its own `if:`, because secret-scan.yml does not
  # run for every event this workflow does: it triggers on `pull_request` and
  # `push: branches: [main]`, so on a `main` ref there is a run to wait for and
  # anywhere else there is not. Waiting where no run exists polls until the
  # 30-minute timeout and fails the publish. That covers push and dispatch on
  # `main`. It does NOT cover a `workflow_dispatch` on another ref, which still
  # publishes a `<twin>-<sha>` tag: `Push scanned image` below is only
  # `event_name != 'pull_request'`, so write access is the whole gate there.
  wait-gates:
    name: twin image (wait for gates)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Non-PR only. The wait exists so an image cannot be PUSHED ahead of the
      # gates that vet it, and `Push scanned image` below is itself
      # `event_name != 'pull_request'` — so on a PR this step held a runner open
      # for the full ci.yml duration (~7 min) to order a push that never
      # happens. The PR arm still builds and Trivy-scans; what it does NOT do is
      # write to a registry, sign or attest — `Push scanned image`, the three
      # cosign installs and the signing step are each already
      # `event_name != 'pull_request'`. Its one outward effect is the SBOM
      # build artifact, which nothing in the trust path reads (pome-cloud
      # verifies the cosign signature on the GHCR digest, never a CI artifact).
      - name: Wait for the ci workflow on this SHA
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # PRs use the merge commit as github.sha; workflow runs are keyed by the
        # head SHA. Passed as an argument — the runner silently ignores env:
        # overrides of default GITHUB_* variables, so an `env: GITHUB_SHA:`
        # form waits on the merge SHA forever and times out on every PR.
        run: |
          set -euo pipefail
          sha="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          bash scripts/ci/wait-for-workflow.sh ci.yml "$sha"
      - name: Wait for the secret-scan workflow on this SHA
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: bash scripts/ci/wait-for-workflow.sh secret-scan.yml "$SHA"

  publish:
    name: twin image (${{ matrix.twin }})
    needs: [wait-gates, detect-twins]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        twin: ${{ fromJSON(needs.detect-twins.outputs.twins) }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          # One shared package, one image per twin distinguished by tag
          # prefix: ghcr.io/pome-sh/twins:<twin> (rolling) and :<twin>-<sha>.
          # `latest=false` — a single `latest` can't span three
          # twins in one package.
          images: ghcr.io/pome-sh/twins
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.twin }},enable={{is_default_branch}}
            type=sha,prefix=${{ matrix.twin }}-,format=short
      # /healthz reports these via the Dockerfiles' GIT_SHA/BUILD_TIME args;
      # without them every published image says git_sha:"dev".
      - name: Resolve build provenance
        id: buildinfo
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Build once and load into the local daemon so Trivy can scan the exact
      # image before it is pushed. Also tag it locally for the scan ref.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: packages/twin-${{ matrix.twin }}/Dockerfile
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            twin-${{ matrix.twin }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
            BUILD_TIME=${{ steps.buildinfo.outputs.time }}
      # Fail the publish on fixable HIGH/CRITICAL CVEs. `ignore-unfixed` drops
      # vulns with no upstream fix (nothing actionable); documented, reviewed
      # exceptions go in `.trivyignore` at the repo root.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: twin-${{ matrix.twin }}:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
      # anchore/sbom-action fetches the syft binary from the anchore
      # release CDN (github.com/anchore/syft/releases) on every run, with no
      # retry of its own, so a 503 there kills this job. On a PR that is noise,
      # but on main the cosign sign/attest steps below DO run, so the same 503
      # fails an image publish.
      #
      # An action step cannot be wrapped in a shell retry loop, so the retry is
      # the STEP, repeated. Attempts 1 and 2 are `continue-on-error`; each later
      # attempt runs only `if:` the earlier ones actually FAILED (a skipped
      # step's outcome is `skipped`, never `failure`, so the chain cannot
      # self-trigger). The last attempt carries no escape hatch, so a genuinely
      # unavailable CDN still refuses the publish — this is persistence, not a
      # relaxed policy.
      #
      # Every copy MUST carry byte-identical `uses:` and `with:` — a retry that
      # installs a different build, or writes a different output file, is not a
      # retry. scripts/ci/assert-hardened-cdn-fetches.mjs enforces that, the
      # attempt count, and the fatal last attempt.
      - name: Generate image SBOM (attempt 1 of 3)
        id: sbom_1
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        continue-on-error: true
        with:
          image: twin-${{ matrix.twin }}:scan
          format: spdx-json
          output-file: twin-${{ matrix.twin }}.spdx.json
          upload-artifact: true
      - name: Back off before SBOM attempt 2
        if: ${{ steps.sbom_1.outcome == 'failure' }}
        run: |
          echo "::warning::SBOM attempt 1 failed. anchore/sbom-action fetches syft from github.com/anchore/syft/releases; retrying in 5s."
          sleep 5
      - name: Generate image SBOM (attempt 2 of 3)
        id: sbom_2
        if: ${{ steps.sbom_1.outcome == 'failure' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        continue-on-error: true
        with:
          image: twin-${{ matrix.twin }}:scan
          format: spdx-json
          output-file: twin-${{ matrix.twin }}.spdx.json
          upload-artifact: true
      - name: Back off before SBOM attempt 3
        if: ${{ steps.sbom_1.outcome == 'failure' && steps.sbom_2.outcome == 'failure' }}
        run: |
          echo "::warning::SBOM attempt 2 failed. github.com/anchore/syft/releases is degraded; last retry in 15s."
          sleep 15
      # Last attempt: no `continue-on-error`. Its failure fails the job.
      - name: Generate image SBOM (attempt 3 of 3)
        id: sbom_3
        if: ${{ steps.sbom_1.outcome == 'failure' && steps.sbom_2.outcome == 'failure' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: twin-${{ matrix.twin }}:scan
          format: spdx-json
          output-file: twin-${{ matrix.twin }}.spdx.json
          upload-artifact: true
      # Fail closed, but say WHAT failed. The step above has already failed the
      # job; this only replaces
      # `##[error]The process '/usr/bin/sh' failed with exit code 1` with the
      # name of the CDN that would not answer, so the run log says whether to
      # re-run or to read the code.
      - name: Name the CDN that failed the SBOM
        if: ${{ failure() && steps.sbom_3.outcome == 'failure' }}
        run: |
          echo "::error::twin-${{ matrix.twin }}: could not generate the image SBOM after 3 attempts. anchore/sbom-action fetches the syft binary from the anchore release CDN (github.com/anchore/syft/releases), and that CDN is unavailable — this is not a failure of the twin, the build or the scan. Failing closed on purpose: an image with no SBOM is never signed, attested or pushed."
          exit 1
      # cosign v2. The v3.0.6 bump (attempted RFC3161-timestamped signatures)
      # was reverted: it gave no benefit — the pome-cloud deploy gate hard-gates
      # only the image SIGNATURE, which verifies on un-timestamped v2 signatures
      # too because the hashedrekord Rekor SET anchors the expired Fulcio cert
      # (the SPDX attestation is best-effort there). And
      # cosign v3 `attest --type spdx` rejected the anchore SBOM predicate
      # ("invalid attestation: decoding json"), failing the sign step on every
      # v3 run and producing NO attestation. v2 signs + attests cleanly.
      #
      # `cosign-release` MUST stay pinned to a v2.x binary. The installer
      # action's DEFAULT cosign version tracks the action major (v3.x installer
      # → cosign v2 default; v4.x installer → cosign v3 default), so an automated
      # bump of the action alone silently drifts the binary to v3 and
      # reintroduces the failure above. Pinning the binary here decouples us
      # from the action version.
      #
      # Repeated for the same reason as the SBOM group above: this
      # installer's whole job is to pull the cosign binary off the sigstore
      # release CDN, and it sits on the publish path one step before signing.
      # ⚠️ ALL THREE COPIES MUST CARRY THE SAME `cosign-release: 'v2.6.4'`.
      # A retry that installs a different cosign is not a retry, and v3 is the
      # exact version the comment above rules out.
      # scripts/ci/assert-hardened-cdn-fetches.mjs reds if the three `with:`
      # blocks ever disagree.
      - name: Install cosign (attempt 1 of 3)
        id: cosign_install_1
        if: ${{ github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        continue-on-error: true
        with:
          cosign-release: 'v2.6.5'
      - name: Back off before cosign install attempt 2
        if: ${{ github.event_name != 'pull_request' && steps.cosign_install_1.outcome == 'failure' }}
        run: |
          echo "::warning::cosign install attempt 1 failed. sigstore/cosign-installer fetches cosign from github.com/sigstore/cosign/releases; retrying in 5s."
          sleep 5
      - name: Install cosign (attempt 2 of 3)
        id: cosign_install_2
        if: ${{ github.event_name != 'pull_request' && steps.cosign_install_1.outcome == 'failure' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        continue-on-error: true
        with:
          cosign-release: 'v2.6.5'
      - name: Back off before cosign install attempt 3
        if: ${{ github.event_name != 'pull_request' && steps.cosign_install_1.outcome == 'failure' && steps.cosign_install_2.outcome == 'failure' }}
        run: |
          echo "::warning::cosign install attempt 2 failed. github.com/sigstore/cosign/releases is degraded; last retry in 15s."
          sleep 15
      # Last attempt: no `continue-on-error`. Its failure fails the job, which
      # is the point — an unsigned image must never ship.
      - name: Install cosign (attempt 3 of 3)
        id: cosign_install_3
        if: ${{ github.event_name != 'pull_request' && steps.cosign_install_1.outcome == 'failure' && steps.cosign_install_2.outcome == 'failure' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.5'
      - name: Name the CDN that failed the cosign install
        if: ${{ failure() && steps.cosign_install_3.outcome == 'failure' }}
        run: |
          echo "::error::twin-${{ matrix.twin }}: could not install cosign after 3 attempts. sigstore/cosign-installer fetches the pinned cosign v2.6.4 binary from the sigstore release CDN (github.com/sigstore/cosign/releases), and that CDN is unavailable — this is not a failure of the twin, the build or the scan. Failing closed on purpose: an image that cannot be signed and attested is not pushed."
          exit 1
      # Push the EXACT image built + scanned above (already loaded into the local
      # daemon under every steps.meta.outputs.tags) — no second build, so the
      # published artifact is byte-identical to the one Trivy scanned. PR builds
      # verify + scan but never push; only main / tag pushes publish. Without
      # this gate the GITHUB_TOKEN from a fork or unauthorized actor could poison
      # the image. `github.event_name` is the PR-vs-push signal that survives
      # merge-queue retargeting.
      #
      # GHCR can log every layer as `Pushed`, then answer `unknown blob` and
      # exit 1 — a tag that never existed, with a green-looking push behind it.
      # So the retry, the per-tag manifest read-back and the fail-closed message
      # live in scripts/ci/push-scanned-image.sh rather than inline here, and
      # scripts/ci/assert-hardened-cdn-fetches.mjs (shape c) reds on a registry
      # write that does not go through that helper.
      #
      # Tags arrive through `env:`, not `${{ }}` interpolated into the script,
      # matching the sign step below: a registry/tag string spliced into a shell
      # body is one metadata-action change away from being a shell body.
      - name: Push scanned image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash scripts/ci/push-scanned-image.sh
      # A degraded GHCR can fail `verify-attestation`'s registry READ with
      # `DENIED: denied` after the tags are already pushed, signed and attested
      # — a red job over an artifact that is correct and already public. So
      # these cosign calls retry too.
      #
      # The ladder is per OPERATION and lives in the script, not here, and
      # scripts/ci/assert-hardened-cdn-fetches.mjs (shape d) reds on a cosign
      # call in any `run:` block that does not go through that helper. Reads are
      # in scope for shape (d) where they are exempt from shape (c), for the
      # reason above: by the time this step runs, the push step has already
      # published every tag.
      - name: Sign pushed image digests and attest SBOM
        id: sign
        if: ${{ github.event_name != 'pull_request' }}
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          bash scripts/ci/sign-image-digests.sh "Signed twin-${{ matrix.twin }} image digests" twin-${{ matrix.twin }}.spdx.json
