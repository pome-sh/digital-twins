name: twin image

# Builds, scans and publishes each twin image to GHCR. Waits on ci and secret-scan
# for the same SHA so a red twin cannot ship a rolling tag. cosign stays pinned to
# a v2 binary: v3 `attest --type spdx` rejects the anchore SBOM predicate, and the
# installer action's default tracks its own major.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/twin-github/**'
      - 'packages/twin-gmail/**'
      - 'packages/twin-linear/**'
      - 'packages/twin-slack/**'
      - 'packages/twin-stripe/**'
      - 'packages/wire/**'
      - 'packages/*/package.json'
      - 'package.json'
      - 'package-lock.json'
      - 'cli/package.json'
      - '.dockerignore'
      - '.trivyignore'
      - 'scripts/ci/wait-for-workflow.sh'
      - 'scripts/ci/wait-for-workflow.test.mjs'
      - 'scripts/ci/sign-image-digests.sh'
      - '.github/workflows/ci.yml'
      - '.github/workflows/twin-image.yml'
  workflow_dispatch:

jobs:
  detect-twins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      twins: ${{ steps.detect.outputs.twins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select twin matrix
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          all='["github","slack","stripe","gmail","linear"]'
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "twins=${all}" >> "$GITHUB_OUTPUT"
            echo "Full twin matrix (non-PR event)."
            exit 0
          fi
          mapfile -t files < <(git diff --name-only "${BASE_SHA}" HEAD)
          shared=false
          for f in "${files[@]}"; do
            case "$f" in
              packages/wire/*|package.json|package-lock.json|cli/package.json|.dockerignore|.trivyignore|scripts/ci/*|.github/workflows/*|packages/*/package.json)
                shared=true
                break
                ;;
            esac
          done
          if [[ "${shared}" == "true" ]]; then
            echo "twins=${all}" >> "$GITHUB_OUTPUT"
            echo "Full twin matrix (shared runtime / workflow inputs changed)."
            exit 0
          fi
          selected=()
          for twin in github slack stripe gmail linear; do
            for f in "${files[@]}"; do
              if [[ "$f" == packages/twin-${twin}/* ]]; then
                selected+=("\"${twin}\"")
                break
              fi
            done
          done
          if [[ "${#selected[@]}" -eq 0 ]]; then
            # Path filter admitted the PR but no twin package matched — keep
            # wait-gates meaningful with a full verify.
            echo "twins=${all}" >> "$GITHUB_OUTPUT"
            echo "Full twin matrix (fallback)."
            exit 0
          fi
          printf -v joined '%s,' "${selected[@]}"
          echo "twins=[${joined%,}]" >> "$GITHUB_OUTPUT"
          echo "PR twin matrix: [${joined%,}]"

  wait-gates:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for the ci workflow on this SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          bash scripts/ci/wait-for-workflow.sh ci.yml "$sha"
      - name: Wait for the secret-scan workflow on this SHA
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: bash scripts/ci/wait-for-workflow.sh secret-scan.yml "$SHA"

  publish:
    name: ${{ matrix.twin }}
    needs: [wait-gates, detect-twins]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        twin: ${{ fromJSON(needs.detect-twins.outputs.twins) }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/pome-sh/twins
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.twin }},enable={{is_default_branch}}
            type=sha,prefix=${{ matrix.twin }}-,format=short
      - name: Resolve build provenance
        id: buildinfo
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: packages/twin-${{ matrix.twin }}/Dockerfile
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            twin-${{ matrix.twin }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
            BUILD_TIME=${{ steps.buildinfo.outputs.time }}
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: twin-${{ matrix.twin }}:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
      - name: Generate image SBOM (attempt 1 of 3)
        id: sbom_1
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        continue-on-error: true
        with:
          image: twin-${{ matrix.twin }}:scan
          format: spdx-json
          output-file: twin-${{ matrix.twin }}.spdx.json
          upload-artifact: true
      - name: Back off before SBOM attempt 2
        if: ${{ steps.sbom_1.outcome == 'failure' }}
        run: |
          echo "::warning::SBOM attempt 1 failed. anchore/sbom-action fetches syft from github.com/anchore/syft/releases; retrying in 5s."
          sleep 5
      - name: Generate image SBOM (attempt 2 of 3)
        id: sbom_2
        if: ${{ steps.sbom_1.outcome == 'failure' }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        continue-on-error: true
        with:
          image: twin-${{ matrix.twin }}:scan
          format: spdx-json
          output-file: twin-${{ matrix.twin }}.spdx.json
          upload-artifact: true
      - name: Back off before SBOM attempt 3
        if: ${{ steps.sbom_1.outcome == 'failure' && steps.sbom_2.outcome == 'failure' }}
        run: |
          echo "::warning::SBOM attempt 2 failed. github.com/anchore/syft/releases is degraded; last retry in 15s."
          sleep 15
      - name: Generate image SBOM (attempt 3 of 3)
        id: sbom_3
        if: ${{ steps.sbom_1.outcome == 'failure' && steps.sbom_2.outcome == 'failure' }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: twin-${{ matrix.twin }}:scan
          format: spdx-json
          output-file: twin-${{ matrix.twin }}.spdx.json
          upload-artifact: true
      - name: Name the CDN that failed the SBOM
        if: ${{ failure() && steps.sbom_3.outcome == 'failure' }}
        run: |
          echo "::error::twin-${{ matrix.twin }}: could not generate the image SBOM after 3 attempts. anchore/sbom-action fetches the syft binary from the anchore release CDN (github.com/anchore/syft/releases), and that CDN is unavailable — this is not a failure of the twin, the build or the scan. Failing closed on purpose: an image with no SBOM is never signed, attested or pushed."
          exit 1
      - name: Install cosign (attempt 1 of 3)
        id: cosign_install_1
        if: ${{ github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        continue-on-error: true
        with:
          cosign-release: 'v2.6.4'
      - name: Back off before cosign install attempt 2
        if: ${{ github.event_name != 'pull_request' && steps.cosign_install_1.outcome == 'failure' }}
        run: |
          echo "::warning::cosign install attempt 1 failed. sigstore/cosign-installer fetches cosign from github.com/sigstore/cosign/releases; retrying in 5s."
          sleep 5
      - name: Install cosign (attempt 2 of 3)
        id: cosign_install_2
        if: ${{ github.event_name != 'pull_request' && steps.cosign_install_1.outcome == 'failure' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        continue-on-error: true
        with:
          cosign-release: 'v2.6.4'
      - name: Back off before cosign install attempt 3
        if: ${{ github.event_name != 'pull_request' && steps.cosign_install_1.outcome == 'failure' && steps.cosign_install_2.outcome == 'failure' }}
        run: |
          echo "::warning::cosign install attempt 2 failed. github.com/sigstore/cosign/releases is degraded; last retry in 15s."
          sleep 15
      - name: Install cosign (attempt 3 of 3)
        id: cosign_install_3
        if: ${{ github.event_name != 'pull_request' && steps.cosign_install_1.outcome == 'failure' && steps.cosign_install_2.outcome == 'failure' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.4'
      - name: Name the CDN that failed the cosign install
        if: ${{ failure() && steps.cosign_install_3.outcome == 'failure' }}
        run: |
          echo "::error::twin-${{ matrix.twin }}: could not install cosign after 3 attempts. sigstore/cosign-installer fetches the pinned cosign v2.6.4 binary from the sigstore release CDN (github.com/sigstore/cosign/releases), and that CDN is unavailable — this is not a failure of the twin, the build or the scan. Failing closed on purpose: an image that cannot be signed and attested is not pushed."
          exit 1
      - name: Push scanned image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash scripts/ci/push-scanned-image.sh
      - name: Sign pushed image digests and attest SBOM
        id: sign
        if: ${{ github.event_name != 'pull_request' }}
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          bash scripts/ci/sign-image-digests.sh "Signed twin-${{ matrix.twin }} image digests" twin-${{ matrix.twin }}.spdx.json
