  </g>
  <text x="240" y="150" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700">Pome Digital Twins</text>
  <text x="240" y="196" fill="#b9c9b0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24">GitHub · Slack · Stripe · Gmail · Linear</text>
