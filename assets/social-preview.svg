<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Pome Digital Twins — Test mode for your integrations, built for the way agents build.">
  <rect width="1280" height="640" fill="#0f1a12"/>
  <!-- logo, inlined from assets/pome-logo.svg -->
  <g transform="translate(96 88) scale(1.1667)">
    <rect width="96" height="96" rx="20" ry="20" fill="#ffffff"/>
