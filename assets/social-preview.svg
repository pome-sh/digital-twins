  <text x="128" y="500" fill="#e6efe2" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="30">npx @pome-sh/cli@latest twin start github</text>
  <text x="96" y="592" fill="#8fa886" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22">Local, stateful, REST + MCP. No test account, no OAuth app, no API key. Every request lands on a tape.</text>
