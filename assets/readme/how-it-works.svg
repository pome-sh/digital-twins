<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="368" viewBox="0 0 1200 368" role="img" aria-labelledby="title desc">
  <title id="title">How Pome works</title>
  <desc id="desc">Five steps: start a twin with one npx command, connect your agent with the printed line, let the agent act, read the tape where a failed write shows as a step that did not happen, then swap the base URL and token for the real API.</desc>
  <rect width="1200" height="368" rx="24" fill="#0f1a12"/>
  <g stroke="#2f4a33" stroke-width="1.5">
    <line x1="56" y1="94" x2="1144" y2="94"/>
    <line x1="56" y1="154" x2="1144" y2="154"/>
    <line x1="56" y1="214" x2="1144" y2="214"/>
    <line x1="56" y1="304" x2="1144" y2="304"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" font-weight="600" fill="#ffffff">
    <text x="112" y="64">Start a twin</text>
    <text x="112" y="124">Connect your agent</text>
    <text x="112" y="184">Let the agent act</text>
    <text x="112" y="244">Read the tape</text>
    <text x="112" y="334">Swap to the real API</text>
  </g>
  <g fill="#d4a017">
    <circle cx="84" cy="56" r="15"/>
    <circle cx="84" cy="116" r="15"/>
    <circle cx="84" cy="176" r="15"/>
    <circle cx="84" cy="236" r="15"/>
    <circle cx="84" cy="326" r="15"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#0f1a12" text-anchor="middle">
    <text x="84" y="62">1</text>
    <text x="84" y="122">2</text>
    <text x="84" y="182">3</text>
    <text x="84" y="242">4</text>
    <text x="84" y="332">5</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#e6efe2" xml:space="preserve">
    <text x="400" y="64">npx @pome-sh/cli@latest twin start github</text>
    <text x="400" y="124">claude mcp add --transport http pome-github … <tspan fill="#8fa886">from step 1</tspan></text>
    <text x="400" y="184">create_issue  <tspan fill="#8fa886">→</tspan>  POST /repos/acme/api/issues</text>
    <text x="400" y="244">19:04:53.762  create_issue       200  semantic  <tspan fill="#ffffff" font-weight="700">changed</tspan></text>
    <text x="400" y="274">19:05:00.780  add_issue_comment  <tspan fill="#d4a017">404</tspan>  semantic  <tspan fill="#d4a017" font-weight="700">no change</tspan></text>
    <text x="400" y="334">POME_GITHUB_REST_URL=https://api.github.com <tspan fill="#8fa886">+ token</tspan></text>
  </g>
</svg>
